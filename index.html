                            <button class="btn-chalk" onclick="app.goToStudentExams()" style="padding:6px 16px;font-size:0.9rem;">← Volver</button>
                        </div>

                        <div class="text-center">
                            <div class="score-circle-chalk ${passed ? 'passed' : 'failed'}">
                                <span class="score-num">${pct.toFixed(0)}%</span>
                                <span class="score-label">${result.score}/${result.total}</span>
                            </div>
                            <div style="font-size:1.4rem;font-weight:600;color:${passed ? 'var(--chalk-green)' : 'var(--chalk-red)'};">
                                ${passed ? '🎉 ¡Aprobado!' : '📚 Reprobado - Sigue practicando'}
                            </div>
                            <div class="chalk-small" style="margin-top:8px;opacity:0.6;">
                                ⏳ Este resultado es provisional. El profesor lo revisará y dará una nota final.
                            </div>
                        </div>

                        <div style="margin-top:20px;">
                            ${result.details.map((d, i) => `
                                <div class="flex" style="align-items:flex-start;gap:8px;padding:4px 0;">
                                    <span>${d.correct ? '✅' : '❌'}</span>
                                    <div>
                                        <div class="math-text" style="font-size:0.95rem;">${d.text}</div>
                                        <div class="chalk-small" style="font-family:monospace;opacity:0.6;">
                                            ${d.type === 'sa' ? `Tu respuesta: ${d.shortAnswer || '—'}` : `Tu respuesta: ${d.options?.[d.chosen] || '—'}`}
                                            ${!d.correct && d.correctIndex !== undefined ? ` · Correcta: ${d.options?.[d.correctIndex] || d.correctAnswer || '—'}` : ''}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <button class="btn-chalk btn-chalk-primary mt-4" onclick="app.goToStudentExams()">← Volver a exámenes</button>
                    </div>
                `;
            }

            // --- STUDENT GRADES (Historial de notas) ---
            renderStudentGrades() {
                const { attemptsOfStudent, loggedStudent } = this.state;

                return `
                    <div>
                        <div class="flex-between" style="margin-bottom:16px;">
                            <div>
                                <h2 class="chalk-title" style="font-size:2.4rem;">📊 Mis Calificaciones</h2>
                                <p class="chalk-subtitle">Resumen de todas tus notas y comentarios</p>
                            </div>
                            <button class="btn-chalk" onclick="app.goToStudentExams()" style="padding:6px 16px;font-size:0.9rem;">← Volver</button>
                        </div>

                        ${attemptsOfStudent.length === 0 ? `
                            <div class="text-center" style="padding:40px 0;">
                                <div style="font-size:4rem;opacity:0.3;">📄</div>
                                <p class="chalk-text">Aún no has completado ningún examen.</p>
                            </div>
                        ` : `
                            ${attemptsOfStudent.map((attempt, index) => {
                                const pct = (attempt.score / attempt.total * 100);
                                const isGraded = attempt.gradingStatus === 'graded';
                                const finalPct = isGraded ? (attempt.finalGrade / attempt.total * 100) : null;
                                const passed = isGraded ? finalPct >= 60 : pct >= 60;
                                const partial = PARTIALS.find(p => p.id === attempt.partialId);
                                return `
                                    <div class="student-grade-summary" style="border-bottom:1px solid rgba(255,255,255,0.06);padding:14px 0;${index > 0 ? 'border-top:1px solid rgba(255,255,255,0.06);' : ''}">
                                        <div class="flex-between">
                                            <div>
                                                <div style="font-weight:600;color:var(--chalk-bright);font-size:1.1rem;">${attempt.examTitle}</div>
                                                <div class="chalk-small">${partial?.name || `Parcial ${attempt.partialId}`} · ${formatDate(attempt.submittedAt)}</div>
                                            </div>
                                            <div style="text-align:right;">
                                                <div class="chalk-small">Provisional: ${attempt.score}/${attempt.total} (${pct.toFixed(0)}%)</div>
                                                ${isGraded ? `
                                                    <div style="font-size:1.1rem;font-weight:700;color:${passed ? 'var(--chalk-green)' : 'var(--chalk-red)'};">
                                                        Final: ${attempt.finalGrade}/${attempt.total} (${finalPct.toFixed(0)}%) ${passed ? '✅' : '❌'}
                                                    </div>
                                                ` : `
                                                    <span class="badge-chalk pending">⏳ Pendiente</span>
                                                `}
                                            </div>
                                        </div>
                                        ${isGraded && attempt.teacherComments && attempt.teacherComments.length > 0 ? `
                                            <div style="margin-top:8px;">
                                                <div class="chalk-small" style="font-weight:bold;">💬 Comentarios del profesor:</div>
                                                ${attempt.teacherComments.map(c => `
                                                    <div class="comment-box" style="background:rgba(255,255,255,0.04);border-radius:6px;padding:8px 14px;margin-top:4px;border-left:2px solid var(--chalk-yellow);">
                                                        <div class="comment-text" style="font-size:0.9rem;">${c.text}</div>
                                                        <div class="comment-date" style="font-size:0.7rem;opacity:0.5;">${c.teacherName} · ${formatDate(c.date)}</div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        ` : isGraded ? `
                                            <div class="chalk-small" style="margin-top:6px;opacity:0.5;">Sin comentarios adicionales.</div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        `}
                    </div>
                `;
            }

            // ============================================================
            // ACCIONES
            // ============================================================

            // --- Navegación ---
            goToHome() { this.setState({ view: 'home', error: '', success: '' }); }
            goToTeacherLogin() { this.setState({ view: 'teacher-login', error: '', success: '', teacherEmail: '',
                    teacherPass: '' }); }
            goToTeacherRegister() { this.setState({ view: 'teacher-register', error: '', success: '', teacherEmail: '',
                    teacherPass: '', teacherName: '', teacherSignupCode: '' }); }
            goToTeacherCourses() { this.setState({ view: 'teacher-courses', error: '', success: '', selectedCourse: null,
                    selectedPartial: null }); }
            goToTeacherPartials() { this.setState({ view: 'teacher-partials', error: '', success: '' }); }
            goToCreateExam() { this.setState({ view: 'teacher-create-exam', error: '', success: '', draftTitle: '',
                    draftQuestions: [], draftTimeLimit: 30 }); }
            goToTeacherGradeExam() { this.loadExams(this.state.selectedCourse, this.state.selectedPartial);
                this.setState({ view: 'teacher-grade-exam', error: '', success: '' }); }
            goToStudentLogin() { this.setState({ view: 'student-login', error: '', success: '', studentEmail: '',
                    studentPass: '' }); }
            goToStudentRegister() { this.setState({ view: 'student-register', error: '', success: '', studentEmail: '',
                    studentPass: '', studentName: '', studentId: '', studentCourse: '' }); }
            goToStudentExams() { this.loadExams(this.state.loggedStudent?.courseId);
                this.setState({ view: 'student-exams', error: '', success: '' }); }
            goToStudentGrades() { this.loadStudentAttempts(this.state.authUser?.uid);
                this.setState({ view: 'student-grades', error: '', success: '' }); }

            selectTeacherCourse(courseId) {
                this.state.selectedCourse = courseId;
                this.state.selectedPartial = null;
                this.setState({ view: 'teacher-partials', error: '', success: '' });
            }

            selectTeacherPartial(partialId) {
                this.state.selectedPartial = partialId;
                this.setState({ view: 'teacher-create-exam', error: '', success: '', draftTitle: '', draftQuestions: [],
                    draftTimeLimit: 30 });
            }

            toggleAttempt(id) {
                this.setState({ openAttempt: this.state.openAttempt === id ? null : id });
            }

            // --- Autenticación ---
            async handleTeacherLogin() {
                const { teacherEmail, teacherPass } = this.state;
                if (!teacherEmail || !teacherPass) return this.setError('Ingresa email y contraseña.');
                this.setBusy(true);
                this.setError('');
                this.setSuccess('');
                try {
                    await FirebaseService.login(teacherEmail, teacherPass);
                } catch (error) {
                    if (error.code === 'auth/user-not-found') this.setError('Usuario no encontrado. Regístrate primero.');
                    else if (error.code === 'auth/wrong-password') this.setError('Contraseña incorrecta.');
                    else this.setError('Error al iniciar sesión. Intenta nuevamente.');
                }
                this.setBusy(false);
            }

            async handleTeacherRegister() {
                const { teacherEmail, teacherPass, teacherName, teacherSignupCode } = this.state;
                if (!teacherName.trim() || !teacherEmail || !teacherPass) return this.setError('Completa todos los campos.');
                if (teacherPass.length < 6) return this.setError('La contraseña debe tener al menos 6 caracteres.');
                if (teacherSignupCode !== TEACHER_SIGNUP_CODE) {
                    return this.setError('❌ Código incorrecto. El código es: ' + TEACHER_SIGNUP_CODE);
                }
                this.setBusy(true);
                this.setError('');
                this.setSuccess('');
                try {
                    const user = await FirebaseService.register(teacherEmail, teacherPass);
                    await FirebaseService.saveTeacher({
                        uid: user.uid,
                        email: teacherEmail,
                        name: teacherName.trim(),
                        role: 'teacher'
                    });
                    this.setSuccess('✅ ¡Registro exitoso! Ahora puedes iniciar sesión.');
                    setTimeout(() => {
                        this.setState({ view: 'teacher-login', teacherEmail: '', teacherPass: '' });
                    }, 1500);
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') this.setError('Este email ya está registrado.');
                    else this.setError('Error al registrarse. Intenta nuevamente.');
                }
                this.setBusy(false);
            }

            async handleStudentLogin() {
                const { studentEmail, studentPass } = this.state;
                if (!studentEmail || !studentPass) return this.setError('Completa todos los campos.');
                this.setBusy(true);
                this.setError('');
                this.setSuccess('');
                try {
                    await FirebaseService.login(studentEmail, studentPass);
                } catch (error) {
                    if (error.code === 'auth/user-not-found') this.setError('Usuario no encontrado. Regístrate primero.');
                    else if (error.code === 'auth/wrong-password') this.setError('Contraseña incorrecta.');
                    else this.setError('Error al iniciar sesión. Intenta nuevamente.');
                }
                this.setBusy(false);
            }

            async handleStudentRegister() {
                const { studentEmail, studentPass, studentName, studentId, studentCourse } = this.state;
                if (!studentName.trim() || !studentId.trim() || !studentEmail || !studentPass) {
                    return this.setError('Completa todos los campos.');
                }
                if (!studentCourse) return this.setError('Selecciona un curso.');
                if (studentPass.length < 6) return this.setError('La contraseña debe tener al menos 6 caracteres.');
                this.setBusy(true);
                this.setError('');
                this.setSuccess('');
                try {
                    const user = await FirebaseService.register(studentEmail, studentPass);
                    await FirebaseService.saveStudent({
                        id: user.uid,
                        name: studentName.trim(),
                        displayId: studentId.trim(),
                        email: studentEmail,
                        uid: user.uid,
                        courseId: studentCourse,
                        role: 'student'
                    });
                    this.setSuccess('✅ ¡Registro exitoso! Ahora puedes iniciar sesión.');
                    setTimeout(() => {
                        this.setState({ view: 'student-login', studentEmail: '', studentPass: '' });
                    }, 1500);
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') this.setError('Este email ya está registrado.');
                    else this.setError('Error al registrarse. Intenta nuevamente.');
                }
                this.setBusy(false);
            }

            async logout() {
                try {
                    await FirebaseService.logout();
                    this.state.isTeacher = false;
                    this.state.teacherData = null;
                    this.state.loggedStudent = null;
                    this.state.authUser = null;
                    this.state.userRole = null;
                    this.state.selectedCourse = null;
                    this.state.selectedPartial = null;
                    if (this.state.examTimer) { clearInterval(this.state.examTimer);
                        this.state.examTimer = null; }
                    this.setState({ view: 'home', error: '', success: '' });
                } catch (error) {
                    console.error('Error al cerrar sesión:', error);
                }
            }

            // --- Exámenes ---
            addDraftQuestion(type) {
                const newQ = { id: genId(), type: type, text: '' };
                if (type === 'tf') { newQ.options = ['Verdadero', 'Falso'];
                    newQ.correctIndex = 0; } else if (type === 'sa') { newQ.correctAnswer = '';
                    newQ.keywords = '';
                    newQ.correctIndex = null; } else { newQ.options = ['', '', '', ''];
                    newQ.correctIndex = 0; }
                this.state.draftQuestions.push(newQ);
                this.render();
            }

            updateDraftQuestion(id, patch) {
                const q = this.state.draftQuestions.find(q => q.id === id);
                if (q) Object.assign(q, patch);
                this.render();
            }

            updateOption(id, i, value) {
                const q = this.state.draftQuestions.find(q => q.id === id);
                if (q && q.options) q.options[i] = value;
                this.render();
            }

            removeDraftQuestion(id) {
                this.state.draftQuestions = this.state.draftQuestions.filter(q => q.id !== id);
                this.render();
            }

            async saveDraftExam() {
                const { draftTitle, draftQuestions, draftTimeLimit, selectedCourse, selectedPartial, teacherData } = this.state;
                if (!draftTitle.trim()) return this.setError('Ponle un título al examen.');
                if (draftQuestions.length === 0) return this.setError('Agrega al menos una pregunta.');
                for (const q of draftQuestions) {
                    if (!q.text.trim()) return this.setError('Hay una pregunta sin enunciado.');
                    if (q.type !== 'sa' && q.options && q.options.some(o => !o.trim())) {
                        return this.setError('Hay una opción vacía.');
                    }
                    if (q.type === 'sa' && !q.correctAnswer?.trim()) {
                        return this.setError('La pregunta de respuesta corta debe tener una respuesta correcta definida.');
                    }
                }
                this.setBusy(true);
                this.setError('');
                this.setSuccess('');
                try {
                    await FirebaseService.saveExam({
                        title: draftTitle.trim(),
                        courseId: selectedCourse,
                        partialId: selectedPartial,
                        questions: draftQuestions,
                        timeLimit: draftTimeLimit,
                        createdBy: teacherData?.email || 'teacher',
                        createdByName: teacherData?.name || 'Profesor'
                    });
                    this.setSuccess('✅ Examen guardado exitosamente.');
                    setTimeout(() => {
                        this.goToTeacherPartials();
                    }, 1000);
                } catch (error) {
                    this.setError('Error al guardar el examen.');
                }
                this.setBusy(false);
            }

            // --- Tomar examen ---
            async startExam(examId) {
                this.setBusy(true);
                try {
                    const exam = await FirebaseService.getExam(examId);
                    if (!exam) { this.setError('El examen no existe.');
                        this.setBusy(false); return; }
                    this.state.activeExam = exam;
                    this.state.answers = {};
                    this.state.result = null;
                    this.state.timeRemaining = (exam.timeLimit || 30) * 60;
                    this.setState({ view: 'student-taking-exam', error: '', success: '' });
                    if (this.state.examTimer) clearInterval(this.state.examTimer);
                    this.state.examTimer = setInterval(() => {
                        this.state.timeRemaining--;
                        if (this.state.timeRemaining <= 0) {
                            clearInterval(this.state.examTimer);
                            this.state.examTimer = null;
                            this.submitExam(true);
                        }
                        this.render();
                    }, 1000);
                } catch (error) { this.setError('Error al cargar el examen.'); }
                this.setBusy(false);
            }

            setAnswer(qId, value) { this.state.answers[qId] = value;
                this.render(); }
            setShortAnswer(qId, value) { this.state.answers[qId] = value;
                this.render(); }

            async submitExam(autoSubmit = false) {
                const { activeExam, answers, loggedStudent } = this.state;
                if (!autoSubmit && Object.keys(answers).length < activeExam.questions.length) {
                    return this.setError('Responde todas las preguntas antes de enviar.');
                }
                if (this.state.examTimer) { clearInterval(this.state.examTimer);
                    this.state.examTimer = null; }
                this.setBusy(true);
                this.setError('');
                this.setSuccess('');

                let score = 0;
                const details = activeExam.questions.map(q => {
                    const chosen = answers[q.id];
                    let correct = false;
                    if (q.type === 'sa') {
                        const correctAnswer = (q.correctAnswer || '').trim().toLowerCase();
                        const studentAnswer = (chosen || '').trim().toLowerCase();
                        const cleanCorrect = correctAnswer.replace(/\s+/g, ' ');
                        const cleanStudent = studentAnswer.replace(/\s+/g, ' ');
                        correct = cleanStudent === cleanCorrect;
                        if (!correct && q.keywords) {
                            const keywords = q.keywords.split(',').map(k => k.trim().toLowerCase()).filter(Boolean);
                            correct = keywords.some(k => cleanStudent.includes(k));
                        }
                    } else {
                        correct = chosen === q.correctIndex;
                    }
                    if (correct) score++;
                    return {
                        questionId: q.id,
                        text: q.text,
                        type: q.type,
                        options: q.options || [],
                        correctIndex: q.correctIndex,
                        correctAnswer: q.correctAnswer || '',
                        keywords: q.keywords || '',
                        chosen: q.type === 'sa' ? null : chosen,
                        shortAnswer: q.type === 'sa' ? chosen || '' : null,
                        correct
                    };
                });

                const attempt = {
                    studentName: loggedStudent.name,
                    studentId: loggedStudent.id,
                    examId: activeExam.id,
                    examTitle: activeExam.title,
                    courseId: activeExam.courseId,
                    partialId: activeExam.partialId,
                    score,
                    total: activeExam.questions.length,
                    details,
                    autoSubmitted: autoSubmit,
                    gradingStatus: 'pending',
                    finalGrade: null,
                    teacherComments: []
                };

                try {
                    await FirebaseService.saveAttempt(attempt);
                    await this.loadStudentAttempts(loggedStudent.id);
                    this.state.result = attempt;
                    this.setState({ view: 'student-result', error: '', success: '¡Examen enviado exitosamente!' });
                } catch (error) { this.setError('Error al guardar el intento.'); }
                this.setBusy(false);
            }

            cancelExam() {
                if (this.state.examTimer) { clearInterval(this.state.examTimer);
                    this.state.examTimer = null; }
                this.setState({ view: 'student-exams', error: '', success: '' });
            }

            // --- Calificación ---
            async goToGrade(attemptId) {
                this.setBusy(true);
                try {
                    const attempt = await FirebaseService.getAttempt(attemptId);
                    if (!attempt) { this.setError('No se encontró el intento.');
                        this.setBusy(false); return; }
                    const questions = attempt.details.map((d, i) => ({ ...d, index: i, gradingCorrect: d.correct }));
                    this.state.gradingAttempt = attempt;
                    this.state.gradingQuestions = questions;
                    this.setState({ view: 'teacher-grade', error: '', success: '' });
                } catch (error) { this.setError('Error al cargar el intento.'); }
                this.setBusy(false);
            }

            updateGradingQuestion(index, isCorrect) {
                const q = this.state.gradingQuestions[index];
                if (q) { q.gradingCorrect = isCorrect;
                    this.render(); }
            }

            async saveGrade() {
                const { gradingAttempt, gradingQuestions, teacherData } = this.state;
                if (!gradingAttempt) return;
                const commentInput = document.getElementById('teacherCommentInput');
                const comment = commentInput ? commentInput.value.trim() : '';

                let finalScore = 0;
                const updatedDetails = gradingAttempt.details.map((d, i) => {
                    const q = gradingQuestions.find(g => g.index === i);
                    const isCorrect = q ? q.gradingCorrect : d.correct;
                    if (isCorrect) finalScore++;
                    return { ...d, correct: isCorrect };
                });

                this.setBusy(true);
                this.setError('');
                this.setSuccess('');
                try {
                    await FirebaseService.updateAttempt(gradingAttempt.id, {
                        finalGrade: finalScore,
                        gradingStatus: 'graded',
                        details: updatedDetails
                    });
                    if (comment) {
                        await FirebaseService.addCommentToAttempt(
                            gradingAttempt.id,
                            comment,
                            teacherData?.name || 'Profesor'
                        );
                    }
                    this.setSuccess('✅ Calificación guardada exitosamente.');
                    setTimeout(() => this.goToTeacherGradeExam(), 1000);
                } catch (error) { this.setError('Error al guardar la calificación.'); }
                this.setBusy(false);
            }

            // --- Resultados ---
            async openResults(examId) {
                this.setBusy(true);
                try {
                    const exam = await FirebaseService.getExam(examId);
                    const attempts = await FirebaseService.getAttemptsByExam(examId);
                    let stats = null;
                    if (attempts.length > 0) {
                        const scores = attempts.map(a => (a.score / a.total) * 100);
                        const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
                        const passRate = (scores.filter(s => s >= 60).length / scores.length) * 100;
                        stats = { avg, passRate, total: attempts.length };
                    }
                    this.state.resultsExam = exam;
                    this.state.resultsList = attempts;
                    this.state.stats = stats;
                    this.state.openAttempt = null;
                    this.setState({ view: 'teacher-results', error: '', success: '' });
                } catch (error) { this.setError('Error al cargar resultados.'); }
                this.setBusy(false);
            }

            async deleteExam(examId) {
                if (!confirm('¿Eliminar este examen y todos sus resultados?')) return;
                this.setBusy(true);
                try {
                    await FirebaseService.deleteExam(examId);
                    this.loadExams(this.state.selectedCourse, this.state.selectedPartial);
                    this.setSuccess('✅ Examen eliminado.');
                    this.render();
                } catch (error) { this.setError('Error al eliminar el examen.'); }
                this.setBusy(false);
            }
        }

        // ============================================================
        // INICIALIZAR
        // ============================================================
        const app = new App();
        window.app = app;
    </script>

</body>
</html>
