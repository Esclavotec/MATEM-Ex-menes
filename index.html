<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATEM - Precálculo</title>
    <!-- MathJax para texto matemático -->
    <script>
        MathJax = {
            tex: {

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --surface-alt: #F1F5F9;
            --border: #E2E8F0;
            --border-strong: #CBD5E1;

            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --text-faint: #94A3B8;

            --accent: #4F46E5;
            --accent-hover: #4338CA;
            --accent-light: #EEF2FF;

            --success: #16A34A;
            --success-hover: #15803D;
            --success-light: #DCFCE7;

            --danger: #DC2626;
            --danger-hover: #B91C1C;
            --danger-light: #FEE2E2;

            --warning: #D97706;
            --warning-hover: #B45309;
            --warning-light: #FEF3C7;

            --purple: #7C3AED;
            --purple-hover: #6D28D9;

            --info: #0284C7;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 6px 16px -4px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 40px -16px rgba(15, 23, 42, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text-secondary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* ---------- Header ---------- */
        .header {
            background: var(--text-primary);
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* ---------- Buttons ---------- */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
            font-size: 0.9rem;
        }
        .btn:active {
            opacity: 0.85;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
        }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover {
            background: var(--success-hover);
        }
        .btn-secondary {
            background: var(--text-primary);
            color: white;
        }
        .btn-secondary:hover {
            background: #1E293B;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            background: var(--surface-alt);
            border-color: var(--border-strong);
        }
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        .btn-warning:hover {
            background: var(--warning-hover);
        }
        .btn-purple {
            background: var(--purple);
            color: white;
        }
        .btn-purple:hover {
            background: var(--purple-hover);
        }

        /* ---------- Cards ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }
        .card-subtitle {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 22px;
        }

        /* ---------- Courses ---------- */
        .course-grid {
            display: grid;
            gap: 14px;
        }
        .course-item {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            background: var(--surface);
        }
        .course-item:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-md);
        }
        .course-item.active {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .course-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .course-icon {
            font-size: 1.6rem;
        }
        .course-info {
            flex: 1;
        }
        .course-title {
            font-weight: 600;
            font-size: 1.02rem;
            color: var(--text-primary);
        }
        .course-subtitle {
            color: var(--text-muted);
            font-size: 0.87rem;
        }
        .course-details {
            margin-top: 12px;
        }
        .course-details p {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }
        .topic-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            background: #E0F2FE;
            color: var(--info);
            margin: 3px 4px 3px 0;
        }

        /* ---------- Exams ---------- */
        .exam-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--surface-alt);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
            transition: border-color 0.15s ease;
        }
        .exam-item:hover {
            border-color: var(--border);
        }
        .exam-title {
            font-weight: 600;
            color: var(--text-primary);
        }
        .exam-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ---------- Forms ---------- */
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            outline: none;
            transition: border 0.15s ease, box-shadow 0.15s ease;
            font-family: inherit;
            background: var(--surface);
            color: var(--text-primary);
        }
        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .error-msg {
            background: var(--danger-light);
            color: var(--danger-hover);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .success-msg {
            background: var(--success-light);
            color: var(--success-hover);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        /* ---------- Questions ---------- */
        .question-block {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-bottom: 12px;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .question-header span {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
        }
        .option-row input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }
        .option-row input[type="text"] {
            flex: 1;
            padding: 6px 10px;
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            outline: none;
            font-family: inherit;
        }
        .option-row input[type="text"]:focus {
            border-bottom-color: var(--accent);
        }

        /* ---------- Score / results ---------- */
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
        }
        .score-circle.passed {
            border: 4px solid var(--success);
            background: var(--success-light);
        }
        .score-circle.failed {
            border: 4px solid var(--danger);
            background: var(--danger-light);
        }
        .score-circle.pending {
            border: 4px solid var(--warning);
            background: var(--warning-light);
        }
        .score-number {
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        .score-label {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* ---------- Utilities ---------- */
        .flex {
            display: flex;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .text-center { text-align: center; }
        .text-sm { font-size: 0.88rem; }
        .text-xs { font-size: 0.75rem; }
        .text-muted { color: var(--text-muted); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-primary { color: var(--text-primary); }
        .text-warning { color: var(--warning-hover); }
        .hidden { display: none !important; }
        .w-full { width: 100%; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 768px) {
            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr;
            }
            .header {
                padding: 14px 20px;
                flex-direction: column;
                text-align: center;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .card {
                padding: 18px;
            }
        }

        /* ---------- Loading ---------- */
        .spinner {
            border: 3px solid var(--surface-alt);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.7s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ---------- Timer ---------- */
        .timer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            background: var(--surface-alt);
            color: var(--text-primary);
        }
        .timer-warning {
            background: var(--danger-light);
            color: var(--danger-hover);
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .radio-option:hover {
            background: var(--surface-alt);
        }
        .short-answer-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            outline: none;
            transition: border 0.15s ease;
            font-family: inherit;
            margin-top: 4px;
        }
        .short-answer-input:focus {
            border-color: var(--accent);
        }

        /* ---------- Badges ---------- */
        .grade-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .grade-badge.passed {
            background: var(--success-light);
            color: var(--success-hover);
        }
        .grade-badge.failed {
            background: var(--danger-light);
            color: var(--danger-hover);
        }
        .grade-badge.pending {
            background: var(--warning-light);
            color: var(--warning-hover);
        }

        .comment-box {
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-top: 8px;
            border-left: 3px solid var(--accent);
        }
        .comment-box .comment-text {
            font-size: 0.92rem;
            color: var(--text-secondary);
        }
        .comment-box .comment-date {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .student-grade-summary {
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
        }
        .student-grade-summary:last-child {
            border-bottom: none;
        }
        .profile-section {
            background: var(--surface-alt);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-top: 16px;
        }
        .profile-section h4 {
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .math-text {
            font-size: 1.02rem;
            padding: 4px 0;
        }
        .math-text .math {
            font-size: 1.05rem;
        }
        .teacher-code-hint {
            background: var(--accent-light);
            border: 1px dashed #C7D2FE;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .teacher-code-hint code {
            background: var(--surface);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <script>
        // ============================================
        // CONFIGURACIÓN DE FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvKlGSfuc7so2XLxh5sMCWnZc-4hf3eaM",
            authDomain: "matem-examenes.firebaseapp.com",
            projectId: "matem-examenes",
            storageBucket: "matem-examenes.firebasestorage.app",
            messagingSenderId: "869577580827",
            appId: "1:869577580827:web:d96f639e20f21bc0fbb3be",
            measurementId: "G-0TWL32GYG2"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Habilitar persistencia offline
        db.enablePersistence().catch(err => console.warn('Persistencia offline no disponible:', err));

        // ============================================
        // CÓDIGO ESPECIAL PARA PROFESORES
        // ============================================
        const TEACHER_SIGNUP_CODE = "MATEM2024"; // Código para registrarse como profesor

        // ============================================
        // DATOS DEL CURSO
        // ============================================
        const COURSE_PARTS = [{
            id: 1,
            title: "Precálculo I",
            subtitle: "Fundamentos de Álgebra",
            description: "Álgebra básica, ecuaciones lineales, cuadráticas, sistemas de ecuaciones, funciones y sus gráficas.",
            topics: [
                "Propiedades de los números reales",
                "Ecuaciones y desigualdades",
                "Funciones y sus gráficas",
                "Funciones lineales y cuadráticas",
                "Sistemas de ecuaciones"
            ],
            color: "#0284C7",
            icon: "📚"
        }, {
            id: 2,
            title: "Precálculo II",
            subtitle: "Funciones Avanzadas",
            description: "Funciones polinomiales, racionales, exponenciales, logarítmicas y trigonometría básica.",
            topics: [
                "Funciones polinomiales",
                "Funciones racionales",
                "Funciones exponenciales",
                "Funciones logarítmicas",
                "Introducción a la trigonometría"
            ],
            color: "#22C55E",
            icon: "📖"
        }, {
            id: 3,
            title: "Precálculo III",
            subtitle: "Trigonometría y Geometría",
            description: "Trigonometría avanzada, identidades, ecuaciones trigonométricas, geometría analítica y secciones cónicas.",
            topics: [
                "Identidades trigonométricas",
                "Ecuaciones trigonométricas",
                "Ley de senos y cosenos",
                "Secciones cónicas",
                "Geometría analítica"
            ],
            color: "#4F46E5",
            icon: "📐"
        }, {
            id: 4,
            title: "Precálculo IV",
            subtitle: "Matemáticas Discretas y Probabilidad",
            description: "Sucesiones, series, matrices, probabilidad, estadística y fundamentos del cálculo.",
            topics: [
                "Sucesiones y series",
                "Matrices y determinantes",
                "Probabilidad básica",
                "Estadística descriptiva",
                "Introducción al cálculo"
            ],
            color: "#8B5CF6",
            icon: "📊"
        }];

        // ============================================
        // UTILIDADES
        // ============================================
        function genId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function sanitize(str) {
            return (str || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").slice(0, 60) || "anon";
        }

        function formatDate(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleString('es-ES', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderMath() {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }
        }

        // ============================================
        // SERVICIOS DE FIREBASE
        // ============================================
        const FirebaseService = {
            // --- Exámenes ---
            async getExams() {
                try {
                    const snapshot = await db.collection('exams')
                        .orderBy('createdAt', 'desc')
                        .get();
                    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error('Error obteniendo exámenes:', error);
                    return [];
                }
            },

            async getExam(examId) {
                try {
                    const doc = await db.collection('exams').doc(examId).get();
                    if (!doc.exists) return null;
                    return { id: doc.id, ...doc.data() };
                } catch (error) {
                    console.error('Error obteniendo examen:', error);
                    return null;
                }
            },

            async saveExam(examData) {
                try {
                    const docRef = await db.collection('exams').add({
                        ...examData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    return docRef.id;
                } catch (error) {
                    console.error('Error guardando examen:', error);
                    throw error;
                }
            },

            async deleteExam(examId) {
                try {
                    await db.collection('exams').doc(examId).delete();
                    const attempts = await db.collection('attempts')
                        .where('examId', '==', examId)
                        .get();
                    const batch = db.batch();
                    attempts.docs.forEach(doc => {
                        batch.delete(doc.ref);
                    });
                    await batch.commit();
                    return true;
                } catch (error) {
                    console.error('Error eliminando examen:', error);
                    throw error;
                }
            },

            // --- Intentos ---
            async saveAttempt(attemptData) {
                try {
                    const docRef = await db.collection('attempts').add({
                        ...attemptData,
                        submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        gradingStatus: 'pending',
                        finalGrade: null,
                        teacherComments: []
                    });
                    return docRef.id;
                } catch (error) {
                    console.error('Error guardando intento:', error);
                    throw error;
                }
            },

            async getAttemptsByExam(examId) {
                try {
                    const snapshot = await db.collection('attempts')
                        .where('examId', '==', examId)
                        .orderBy('submittedAt', 'desc')
                        .get();
                    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error('Error obteniendo intentos:', error);
                    return [];
                }
            },

            async getAttemptsByStudent(studentId) {
                try {
                    const snapshot = await db.collection('attempts')
                        .where('studentId', '==', studentId)
                        .orderBy('submittedAt', 'desc')
                        .get();
                    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error('Error obteniendo intentos del estudiante:', error);
                    return [];
                }
            },

            async getAttempt(attemptId) {
                try {
                    const doc = await db.collection('attempts').doc(attemptId).get();
                    if (!doc.exists) return null;
                    return { id: doc.id, ...doc.data() };
                } catch (error) {
                    console.error('Error obteniendo intento:', error);
                    return null;
                }
            },

            async updateAttempt(attemptId, data) {
                try {
                    await db.collection('attempts').doc(attemptId).update({
                        ...data,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    return true;
                } catch (error) {
                    console.error('Error actualizando intento:', error);
                    throw error;
                }
            },

            async addCommentToAttempt(attemptId, comment, teacherName) {
                try {
                    const attemptRef = db.collection('attempts').doc(attemptId);
                    await attemptRef.update({
                        teacherComments: firebase.firestore.FieldValue.arrayUnion({
                            id: genId(),
                            text: comment,
                            teacherName: teacherName,
                            date: firebase.firestore.FieldValue.serverTimestamp()
                        })
                    });
                    return true;
                } catch (error) {
                    console.error('Error agregando comentario:', error);
                    throw error;
                }
            },

            // --- Estudiantes ---
            async getStudent(studentId) {
                try {
                    const doc = await db.collection('students').doc(studentId).get();
                    if (!doc.exists) return null;
                    return { id: doc.id, ...doc.data() };
                } catch (error) {
                    console.error('Error obteniendo estudiante:', error);
                    return null;
                }
            },

            async saveStudent(studentData) {
                try {
                    await db.collection('students').doc(studentData.id).set({
                        ...studentData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    return studentData.id;
                } catch (error) {
                    console.error('Error guardando estudiante:', error);
                    throw error;
                }
            },

            // --- Profesores ---
            async getTeacher(uid) {
                try {
                    const doc = await db.collection('teachers').doc(uid).get();
                    if (!doc.exists) return null;
                    return { id: doc.id, ...doc.data() };
                } catch (error) {
                    console.error('Error obteniendo profesor:', error);
                    return null;
                }
            },

            async saveTeacher(teacherData) {
                try {
                    await db.collection('teachers').doc(teacherData.uid).set({
                        ...teacherData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    return teacherData.uid;
                } catch (error) {
                    console.error('Error guardando profesor:', error);
                    throw error;
                }
            },

            async getAllTeachers() {
                try {
                    const snapshot = await db.collection('teachers').get();
                    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error('Error obteniendo profesores:', error);
                    return [];
                }
            },

            // --- Autenticación ---
            async login(email, password) {
                try {
                    const userCredential = await auth.signInWithEmailAndPassword(email, password);
                    return userCredential.user;
                } catch (error) {
                    console.error('Error de autenticación:', error);
                    throw error;
                }
            },

            async register(email, password) {
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    return userCredential.user;
                } catch (error) {
                    console.error('Error registrando usuario:', error);
                    throw error;
                }
            },

            async logout() {
                try {
                    await auth.signOut();
                } catch (error) {
                    console.error('Error cerrando sesión:', error);
                }
            },

            // Suscripciones en tiempo real
            subscribeToExams(callback) {
                return db.collection('exams')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const exams = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        callback(exams);
                    }, (error) => {
                        console.error('Error en suscripción:', error);
                    });
            },

            subscribeToAttemptsByExam(examId, callback) {
                return db.collection('attempts')
                    .where('examId', '==', examId)
                    .orderBy('submittedAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const attempts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        callback(attempts);
                    }, (error) => {
                        console.error('Error en suscripción:', error);
                    });
            },

            subscribeToStudentAttempts(studentId, callback) {
                return db.collection('attempts')
                    .where('studentId', '==', studentId)
                    .orderBy('submittedAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const attempts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        callback(attempts);
                    }, (error) => {
                        console.error('Error en suscripción:', error);
                    });
            }
        };

        // ============================================
        // APLICACIÓN PRINCIPAL
        // ============================================
        class App {
            constructor() {
                this.state = {
                    view: 'home',
                    error: '',
                    success: '',
                    selectedPart: null,

                    // Auth
                    authUser: null,
                    userRole: null, // 'teacher' | 'student'

                    // Teacher
                    teacherEmail: '',
                    teacherPass: '',
                    teacherName: '',
                    teacherSignupCode: '',
                    isTeacher: false,
                    teacherData: null,
                    exams: [],
                    examUnsubscribe: null,

                    // Student
                    studentEmail: '',
                    studentPass: '',
                    studentName: '',
                    studentId: '',
                    loggedStudent: null,
                    attemptsOfStudent: [],
                    studentUnsubscribe: null,

                    // Exam creation
                    draftTitle: '',
                    draftQuestions: [],
                    draftTimeLimit: 30,
                    draftPart: 1,

                    // Taking exam
                    activeExam: null,
                    answers: {},
                    result: null,
                    timeRemaining: 0,
                    examTimer: null,

                    // Results
                    resultsExam: null,
                    resultsList: [],
                    openAttempt: null,
                    stats: null,
                    resultsUnsubscribe: null,

                    // Grading
                    gradingAttempt: null,
                    gradingQuestions: [],

                    busy: false
                };

                // Escuchar cambios de autenticación
                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        this.state.authUser = user;
                        // Verificar si es profesor
                        const teacherData = await FirebaseService.getTeacher(user.uid);
                        if (teacherData) {
                            this.state.isTeacher = true;
                            this.state.teacherData = teacherData;
                            this.state.userRole = 'teacher';
                            await this.loadExams();
                            this.setState({ view: 'teacher-dashboard', error: '', success: '' });
                        } else {
                            // Verificar si es estudiante
                            const studentData = await FirebaseService.getStudent(user.uid);
                            if (studentData) {
                                this.state.loggedStudent = {
                                    ...studentData,
                                    uid: user.uid,
                                    email: user.email
                                };
                                this.state.userRole = 'student';
                                await this.loadStudentAttempts(user.uid);
                                this.setState({ view: 'student-list', error: '', success: '' });
                            } else {
                                // Usuario autenticado pero sin rol - redirigir a home
                                this.setState({ view: 'home', error: '', success: '' });
                            }
                        }
                    } else {
                        this.state.authUser = null;
                        this.state.userRole = null;
                        this.state.isTeacher = false;
                        this.state.teacherData = null;
                        this.state.loggedStudent = null;
                        if (!['teacher-login', 'student-login', 'student-register', 'teacher-register'].includes(this
                                .state.view)) {
                            this.setState({ view: 'home', error: '', success: '' });
                        }
                    }
                    this.render();
                    // Renderizar math después de renderizar
                    setTimeout(renderMath, 300);
                });

                this.render();
            }

            // ============================================
            // MÉTODOS DE ESTADO
            // ============================================
            setState(newState) {
                Object.assign(this.state, newState);
                this.render();
                setTimeout(renderMath, 300);
            }

            setError(msg) {
                this.setState({ error: msg, success: '' });
            }

            setSuccess(msg) {
                this.setState({ success: msg, error: '' });
            }

            setBusy(busy) {
                this.setState({ busy: busy });
            }

            // ============================================
            // CARGA DE DATOS
            // ============================================
            async loadExams() {
                try {
                    const exams = await FirebaseService.getExams();
                    this.state.exams = exams;
                    return exams;
                } catch (error) {
                    console.error('Error cargando exámenes:', error);
                    return [];
                }
            }

            async loadStudentAttempts(uid) {
                try {
                    const attempts = await FirebaseService.getAttemptsByStudent(uid);
                    this.state.attemptsOfStudent = attempts;
                    return attempts;
                } catch (error) {
                    console.error('Error cargando intentos:', error);
                    return [];
                }
            }

            // ============================================
            // RENDER
            // ============================================
            render() {
                const app = document.getElementById('app');
                const { view } = this.state;

                let html = '';

                switch (view) {
                    case 'home':
                        html = this.renderHome();
                        break;
                    case 'teacher-login':
                        html = this.renderTeacherLogin();
                        break;
                    case 'teacher-register':
                        html = this.renderTeacherRegister();
                        break;
                    case 'teacher-dashboard':
                        html = this.renderTeacherDashboard();
                        break;
                    case 'teacher-create':
                        html = this.renderTeacherCreate();
                        break;
                    case 'teacher-results':
                        html = this.renderTeacherResults();
                        break;
                    case 'teacher-grade':
                        html = this.renderTeacherGrade();
                        break;
                    case 'student-login':
                        html = this.renderStudentLogin();
                        break;
                    case 'student-register':
                        html = this.renderStudentRegister();
                        break;
                    case 'student-list':
                        html = this.renderStudentList();
                        break;
                    case 'student-exam':
                        html = this.renderStudentExam();
                        break;
                    case 'student-result':
                        html = this.renderStudentResult();
                        break;
                    case 'student-grades':
                        html = this.renderStudentGrades();
                        break;
                    default:
                        html = this.renderHome();
                }

                app.innerHTML = html;
                setTimeout(renderMath, 400);
            }

                                                        <div class="exam-meta">${e.questions?.length || 0} preguntas · ${e.timeLimit || 30} min</div>
                                                    </div>
                                                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                                        <button class="btn btn-secondary" onclick="app.openResults('${e.id}')" style="padding:6px 16px;font-size:0.85rem;">📊 Resultados</button>
                                                        <button class="btn btn-danger" onclick="app.deleteExam('${e.id}')" style="padding:6px 16px;font-size:0.85rem;">🗑️</button>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    `;
                                }).join('')}
                            `}
                        </div>
                    </div>
                `;
            }

            // --- TEACHER CREATE ---
            renderTeacherCreate() {
                const { error, busy, draftTitle, draftQuestions, draftTimeLimit, draftPart } = this.state;
                const part = COURSE_PARTS.find(p => p.id === draftPart);

                return `
                    <div class="header">
                        <h1>📝 MATEM</h1>
                        <div class="header-buttons">
                            <button class="btn btn-outline" onclick="app.goToTeacherDashboard()">← Volver</button>
                        </div>
                    </div>

                    <div class="container">
                        <div class="card">
                            <h2 class="card-title">Crear Examen</h2>
                            <p class="card-subtitle">${part ? `Parte ${part.id}: ${part.title}` : 'Nuevo examen'}</p>

                            ${error ? `<div class="error-msg">⚠️ ${error}</div>` : ''}

                            <div class="grid-2">
                                <div class="input-group">
                                    <label>Título del examen</label>
                                    <input type="text" value="${draftTitle}" oninput="app.state.draftTitle = this.value" placeholder="Ej: Examen de Álgebra" />

                                    <label>Parte del curso</label>
                                    <select onchange="app.state.draftPart = parseInt(this.value)">
                                        ${COURSE_PARTS.map(p => `
                                            <option value="${p.id}" ${p.id === draftPart ? 'selected' : ''}>${p.title}</option>
                                        `).join('')}

                                </div>
                                <div class="input-group">
                                    <label>Tiempo límite (minutos)</label>
                                    <input type="number" value="${draftTimeLimit}" oninput="app.state.draftTimeLimit = parseInt(this.value) || 1" min="1" max="180" />
