<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATEM - Pizarra Digital</title>
    <!-- MathJax para texto matemático -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [
                    ['$', '$'],
                    ['\\(', '\\)']
                ]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async>
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Patrick+Hand&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ESTILO PIZARRA DE TIZA
           ============================================================ */
        :root {
            --board-bg: #2A4A3A;
            --board-bg-dark: #1A3A2A;
            --board-bg-light: #3A5A4A;
            --chalk: #F5F0E8;
            --chalk-dim: #C5C0B8;
            --chalk-bright: #FFFFFF;
            --chalk-yellow: #F5D76E;
            --chalk-green: #82E0AA;
            --chalk-blue: #85C1E9;
            --chalk-pink: #F1948A;
            --chalk-orange: #F8C471;
            --chalk-purple: #BB8FCE;
            --chalk-red: #F1948A;
            --wood: #8D6E63;
            --wood-dark: #5D4037;
            --wood-light: #A1887F;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius: 12px;
            --chalk-font: 'Patrick Hand', 'Caveat', 'Schoolbell', cursive;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--chalk-font);
            background: var(--board-bg-dark);
            color: var(--chalk);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            position: relative;
        }

        /* Efecto de pizarra con textura */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.005) 2px,
                    rgba(255, 255, 255, 0.005) 4px),
                repeating-linear-gradient(90deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.005) 2px,
                    rgba(255, 255, 255, 0.005) 4px);
            pointer-events: none;
            z-index: 0;
        }

        /* Marco de madera */
        .board-frame {
            max-width: 1100px;
            margin: 20px auto;
            padding: 25px 25px 30px;
            background: var(--wood-dark);
            border-radius: var(--radius);
            box-shadow:
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                0 20px 60px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 1;
            border: 6px solid var(--wood);
        }

        .board-frame::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 12px;
            background: linear-gradient(to bottom, var(--wood-light), var(--wood-dark));
            border-radius: 4px 4px 0 0;
        }

        .board-frame::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 12px;
            background: linear-gradient(to top, var(--wood-light), var(--wood-dark));
            border-radius: 0 0 4px 4px;
        }

        .board-content {
            background: var(--board-bg);
            border-radius: 8px;
            padding: 30px 35px;
            min-height: 85vh;
            position: relative;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Borde de tiza decorativo */
        .board-content::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            pointer-events: none;
        }

        /* ============================================================
           TIPOGRAFÍA DE TIZA
           ============================================================ */
        .chalk-title {
            font-family: var(--chalk-font);
            font-size: 4rem;
            font-weight: 700;
            color: var(--chalk-bright);
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
            letter-spacing: 4px;
            line-height: 1.1;
        }

        .chalk-subtitle {
            font-family: var(--chalk-font);
            font-size: 1.6rem;
            color: var(--chalk-dim);
            font-weight: 400;
        }

        .chalk-text {
            font-family: var(--chalk-font);
            font-size: 1.2rem;
            color: var(--chalk);
        }

        .chalk-small {
            font-family: var(--chalk-font);
            font-size: 0.95rem;
            color: var(--chalk-dim);
        }

        /* ============================================================
           BOTONES DE TIZA
           ============================================================ */
        .btn-chalk {
            font-family: var(--chalk-font);
            padding: 12px 28px;
            border: 2px solid var(--chalk-dim);
            border-radius: 8px;
            background: transparent;
            color: var(--chalk);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            letter-spacing: 1px;
        }

        .btn-chalk:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--chalk-bright);
            color: var(--chalk-bright);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-chalk:active {
            transform: scale(0.97);
        }

        .btn-chalk-primary {
            border-color: var(--chalk-yellow);
            color: var(--chalk-yellow);
        }

        .btn-chalk-primary:hover {
            background: rgba(245, 215, 110, 0.15);
            border-color: var(--chalk-yellow);
            color: var(--chalk-yellow);
        }

        .btn-chalk-success {
            border-color: var(--chalk-green);
            color: var(--chalk-green);
        }

        .btn-chalk-success:hover {
            background: rgba(130, 224, 170, 0.15);
            border-color: var(--chalk-green);
            color: var(--chalk-green);
        }

        .btn-chalk-danger {
            border-color: var(--chalk-red);
            color: var(--chalk-red);
        }

        .btn-chalk-danger:hover {
            background: rgba(241, 148, 138, 0.15);
            border-color: var(--chalk-red);
            color: var(--chalk-red);
        }

        .btn-chalk-blue {
            border-color: var(--chalk-blue);
            color: var(--chalk-blue);
        }

        .btn-chalk-blue:hover {
            background: rgba(133, 193, 233, 0.15);
            border-color: var(--chalk-blue);
            color: var(--chalk-blue);
        }

        .btn-chalk-purple {
            border-color: var(--chalk-purple);
            color: var(--chalk-purple);
        }

        .btn-chalk-purple:hover {
            background: rgba(187, 143, 206, 0.15);
            border-color: var(--chalk-purple);
            color: var(--chalk-purple);
        }

        .btn-chalk-orange {
            border-color: var(--chalk-orange);
            color: var(--chalk-orange);
        }

        .btn-chalk-orange:hover {
            background: rgba(248, 196, 113, 0.15);
            border-color: var(--chalk-orange);
            color: var(--chalk-orange);
        }

        /* ============================================================
           TARJETAS (Pizarra)
           ============================================================ */
        .chalk-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .chalk-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .chalk-card.active {
            border-color: var(--chalk-yellow);
            background: rgba(245, 215, 110, 0.08);
        }

        .chalk-card .card-title {
            font-family: var(--chalk-font);
            font-size: 1.5rem;
            color: var(--chalk-bright);
        }

        .chalk-card .card-sub {
            font-family: var(--chalk-font);
            font-size: 1rem;
            color: var(--chalk-dim);
        }

        /* ============================================================
           CURSOS (4 parciales)
           ============================================================ */
        .partial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin: 20px 0;
        }

        .partial-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 24px 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .partial-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
        }

        .partial-card .partial-number {
            font-family: var(--chalk-font);
            font-size: 2.8rem;
            color: var(--chalk-yellow);
            opacity: 0.6;
        }

        .partial-card .partial-title {
            font-family: var(--chalk-font);
            font-size: 1.2rem;
            color: var(--chalk-bright);
            margin: 6px 0;
        }

        .partial-card .partial-desc {
            font-family: var(--chalk-font);
            font-size: 0.85rem;
            color: var(--chalk-dim);
        }

        /* ============================================================
           INPUTS (estilo tiza)
           ============================================================ */
        .input-chalk {
            font-family: var(--chalk-font);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 12px 18px;
            color: var(--chalk-bright);
            font-size: 1.1rem;
            width: 100%;
            outline: none;
            transition: border 0.2s ease;
        }

        .input-chalk:focus {
            border-color: var(--chalk-yellow);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-chalk::placeholder {
            color: var(--chalk-dim);
            opacity: 0.6;
        }

        .input-chalk-label {
            font-family: var(--chalk-font);
            color: var(--chalk-dim);
            font-size: 0.95rem;
            display: block;
            margin-bottom: 4px;
        }

        select.input-chalk option {
            background: var(--board-bg-dark);
            color: var(--chalk);
        }

        textarea.input-chalk {
            resize: vertical;
            min-height: 80px;
        }

        /* ============================================================
           EXÁMENES
           ============================================================ */
        .exam-item-chalk {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid var(--chalk-yellow);
            flex-wrap: wrap;
            gap: 10px;
        }

        .exam-item-chalk .exam-title {
            font-family: var(--chalk-font);
            font-size: 1.15rem;
            color: var(--chalk-bright);
        }

        .exam-item-chalk .exam-meta {
            font-family: var(--chalk-font);
            font-size: 0.85rem;
            color: var(--chalk-dim);
        }

        /* ============================================================
           QUESTION BLOCK
           ============================================================ */
        .question-block-chalk {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
        }

        .question-block-chalk .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .question-block-chalk .q-header span {
            font-family: var(--chalk-font);
            font-size: 0.8rem;
            color: var(--chalk-dim);
        }

        .option-row-chalk {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 0;
        }

        .option-row-chalk input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--chalk-yellow);
            cursor: pointer;
            flex-shrink: 0;
        }

        .option-row-chalk input[type="text"] {
            flex: 1;
            padding: 6px 10px;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            outline: none;
            font-family: var(--chalk-font);
            color: var(--chalk);
            font-size: 1rem;
        }

        .option-row-chalk input[type="text"]:focus {
            border-bottom-color: var(--chalk-yellow);
        }

        /* ============================================================
           RESULTADOS / SCORE
           ============================================================ */
        .score-circle-chalk {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            border: 4px solid var(--chalk-dim);
        }

        .score-circle-chalk.passed {
            border-color: var(--chalk-green);
        }

        .score-circle-chalk.failed {
            border-color: var(--chalk-red);
        }

        .score-circle-chalk .score-num {
            font-family: var(--chalk-font);
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--chalk-bright);
        }

        .score-circle-chalk .score-label {
            font-family: var(--chalk-font);
            font-size: 0.9rem;
            color: var(--chalk-dim);
        }

        /* ============================================================
           UTILITY
           ============================================================ */
        .flex {
            display: flex;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 14px; }
        .gap-4 { gap: 20px; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 14px; }
        .mt-4 { margin-top: 20px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 14px; }
        .mb-4 { margin-bottom: 20px; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .w-full { width: 100%; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr;
            }
            .board-content {
                padding: 18px 16px;
            }
            .chalk-title {
                font-size: 2.8rem;
            }
            .chalk-subtitle {
                font-size: 1.2rem;
            }
            .btn-chalk {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }

        /* ============================================================
           SPINNER
           ============================================================ */
        .spinner-chalk {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--chalk-yellow);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================================
           TIMER
           ============================================================ */
        .timer-chalk {
            font-family: var(--chalk-font);
            font-size: 1.4rem;
            padding: 8px 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: var(--chalk);
        }

        .timer-chalk.warning {
            border-color: var(--chalk-red);
            color: var(--chalk-red);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ============================================================
           ERROR / SUCCESS
           ============================================================ */
        .msg-chalk {
            padding: 14px 20px;
            border-radius: 8px;
            font-family: var(--chalk-font);
            font-size: 1rem;
            margin-bottom: 14px;
            border: 1px solid transparent;
        }

        .msg-chalk.error {
            background: rgba(241, 148, 138, 0.15);
            border-color: var(--chalk-red);
            color: var(--chalk-red);
        }

        .msg-chalk.success {
            background: rgba(130, 224, 170, 0.15);
            border-color: var(--chalk-green);
            color: var(--chalk-green);
        }

        /* ============================================================
           BORRADOR / DECORACIONES
           ============================================================ */
        .chalk-dust {
            position: absolute;
            bottom: 0;
            right: 20px;
            font-size: 3rem;
            opacity: 0.1;
            pointer-events: none;
            user-select: none;
            font-family: var(--chalk-font);
        }

        .divider-chalk {
            border: none;
            border-top: 2px dashed rgba(255, 255, 255, 0.08);
            margin: 20px 0;
        }

        .badge-chalk {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-family: var(--chalk-font);
            font-size: 0.8rem;
            border: 1px solid;
        }

        .badge-chalk.passed {
            border-color: var(--chalk-green);
            color: var(--chalk-green);
        }

        .badge-chalk.failed {
            border-color: var(--chalk-red);
            color: var(--chalk-red);
        }

        .badge-chalk.pending {
            border-color: var(--chalk-orange);
            color: var(--chalk-orange);
        }

        /* Scrollbar estilo tiza */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <div class="board-frame">
        <div class="board-content" id="app">
            <!-- El contenido se renderiza aquí -->
            <div class="flex-center" style="min-height:70vh;">
                <div class="spinner-chalk"></div>
                <span class="chalk-text">Cargando pizarra...</span>
            </div>
        </div>
        <div class="chalk-dust">✦</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <script>
        // ============================================================
        // CONFIGURACIÓN DE FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvKlGSfuc7so2XLxh5sMCWnZc-4hf3eaM",
            authDomain: "matem-examenes.firebaseapp.com",
            projectId: "matem-examenes",
            storageBucket: "matem-examenes.firebasestorage.app",
            messagingSenderId: "869577580827",
            appId: "1:869577580827:web:d96f639e20f21bc0fbb3be",
            measurementId: "G-0TWL32GYG2"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Habilitar persistencia offline
        db.enablePersistence().catch(err => console.warn('Persistencia offline no disponible:', err));

        // ============================================================
        // CÓDIGO ESPECIAL PARA PROFESORES
        // ============================================================
        const TEACHER_SIGNUP_CODE = "MATEM2024";

        // ============================================================
        // DATOS DE CURSOS Y PARCIALES
        // ============================================================
        const COURSES = [{
            id: 'precalculo',
            name: 'Precálculo',
            icon: '📐',
            description: 'Fundamentos de matemáticas para cálculo'
        }, {
            id: 'expresiones',
            name: 'Expresiones Algebraicas',
            icon: '✏️',
            description: 'Álgebra, ecuaciones y polinomios'
        }];

        const PARTIALS = [
            { id: 1, name: 'Primer Parcial', icon: '❶' },
            { id: 2, name: 'Segundo Parcial', icon: '❷' },
            { id: 3, name: 'Tercer Parcial', icon: '❸' },
            { id: 4, name: 'Cuarto Parcial', icon: '❹' }
        ];

        // ============================================================
        // UTILIDADES
        // ============================================================
        function genId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function formatDate(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleString('es-ES', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderMath() {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }
        }

        // ============================================================
        // SERVICIOS DE FIREBASE
        // ============================================================
        const FirebaseService = {
            // --- Exámenes ---
            async getExams(courseId, partialId) {
                try {
                    let query = db.collection('exams');
                    if (courseId) query = query.where('courseId', '==', courseId);
                    if (partialId) query = query.where('partialId', '==', partialId);
                    const snapshot = await query.orderBy('createdAt', 'desc').get();
                    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error('Error obteniendo exámenes:', error);
                    return [];
                }
            },

            async getExam(examId) {
                try {
                    const doc = await db.collection('exams').doc(examId).get();
                    if (!doc.exists) return null;
                    return { id: doc.id, ...doc.data() };
                } catch (error) {
                    console.error('Error obteniendo examen:', error);
                    return null;
                }
            },

            async saveExam(examData) {
                try {
                    const docRef = await db.collection('exams').add({
                        ...examData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    return docRef.id;
                } catch (error) {
                    console.error('Error guardando examen:', error);
                    throw error;
                }
            },

            async deleteExam(examId) {
                try {
                    await db.collection('exams').doc(examId).delete();
                    // Eliminar intentos asociados
                    const attempts = await db.collection('attempts')
                        .where('examId', '==', examId)
                        .get();
                    const batch = db.batch();
                    attempts.docs.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    return true;
                } catch (error) {
                    console.error('Error eliminando examen:', error);
                    throw error;
                }
            },

            // --- Intentos ---
            async saveAttempt(attemptData) {
                try {
                    const docRef = await db.collection('attempts').add({
                        ...attemptData,
                        submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        gradingStatus: 'pending',
                        finalGrade: null,
                        teacherComments: []
                    });
                    return docRef.id;
                } catch (error) {
                    console.error('Error guardando intento:', error);
                    throw error;
                }
            },

            async getAttemptsByExam(examId) {
                try {
                    const snapshot = await db.collection('attempts')
                        .where('examId', '==', examId)
                        .orderBy('submittedAt', 'desc')
                        .get();
                    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error('Error obteniendo intentos:', error);
                    return [];
                }
            },

            async getAttemptsByStudent(studentId) {
                try {
                    const snapshot = await db.collection('attempts')
                        .where('studentId', '==', studentId)
                        .orderBy('submittedAt', 'desc')
                        .get();
                    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error('Error obteniendo intentos del estudiante:', error);
                    return [];
                }
            },

            async getAttempt(attemptId) {
                try {
                    const doc = await db.collection('attempts').doc(attemptId).get();
                    if (!doc.exists) return null;
                    return { id: doc.id, ...doc.data() };
                } catch (error) {
                    console.error('Error obteniendo intento:', error);
                    return null;
                }
            },

            async updateAttempt(attemptId, data) {
                try {
                    await db.collection('attempts').doc(attemptId).update({
                        ...data,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    return true;
                } catch (error) {
                    console.error('Error actualizando intento:', error);
                    throw error;
                }
            },

            async addCommentToAttempt(attemptId, comment, teacherName) {
                try {
                    await db.collection('attempts').doc(attemptId).update({
                        teacherComments: firebase.firestore.FieldValue.arrayUnion({
                            id: genId(),
                            text: comment,
                            teacherName: teacherName,
                            date: firebase.firestore.FieldValue.serverTimestamp()
                        })
                    });
                    return true;
                } catch (error) {
                    console.error('Error agregando comentario:', error);
                    throw error;
                }
            },

            // --- Estudiantes ---
            async getStudent(studentId) {
                try {
                    const doc = await db.collection('students').doc(studentId).get();
                    if (!doc.exists) return null;
                    return { id: doc.id, ...doc.data() };
                } catch (error) {
                    console.error('Error obteniendo estudiante:', error);
                    return null;
                }
            },

            async saveStudent(studentData) {
                try {
                    await db.collection('students').doc(studentData.id).set({
                        ...studentData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    return studentData.id;
                } catch (error) {
                    console.error('Error guardando estudiante:', error);
                    throw error;
                }
            },

            // --- Profesores ---
            async getTeacher(uid) {
                try {
                    const doc = await db.collection('teachers').doc(uid).get();
                    if (!doc.exists) return null;
                    return { id: doc.id, ...doc.data() };
                } catch (error) {
                    console.error('Error obteniendo profesor:', error);
                    return null;
                }
            },

            async saveTeacher(teacherData) {
                try {
                    await db.collection('teachers').doc(teacherData.uid).set({
                        ...teacherData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    return teacherData.uid;
                } catch (error) {
                    console.error('Error guardando profesor:', error);
                    throw error;
                }
            },

            // --- Autenticación ---
            async login(email, password) {
                try {
                    const userCredential = await auth.signInWithEmailAndPassword(email, password);
                    return userCredential.user;
                } catch (error) {
                    console.error('Error de autenticación:', error);
                    throw error;
                }
            },

            async register(email, password) {
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    return userCredential.user;
                } catch (error) {
                    console.error('Error registrando usuario:', error);
                    throw error;
                }
            },

            async logout() {
                try {
                    await auth.signOut();
                } catch (error) {
                    console.error('Error cerrando sesión:', error);
                }
            }
        };

        // ============================================================
        // APLICACIÓN PRINCIPAL
        // ============================================================
        class App {
            constructor() {
                this.state = {
                    view: 'home', // home, teacher-login, teacher-register, teacher-courses, teacher-partials, 
                    // teacher-create-exam, teacher-grade-exam, student-login, student-register, student-courses,
                    // student-exams, student-taking-exam, student-result, student-grades
                    error: '',
                    success: '',
                    busy: false,

                    // Auth
                    authUser: null,
                    userRole: null, // 'teacher' | 'student'
                    teacherData: null,
                    loggedStudent: null,

                    // Cursos seleccionados
                    selectedCourse: null,
                    selectedPartial: null,

                    // Exámenes
                    exams: [],
                    activeExam: null,
                    answers: {},
                    result: null,
                    timeRemaining: 0,
                    examTimer: null,
                    attemptsOfStudent: [],

                    // Creación de examen
                    draftTitle: '',
                    draftQuestions: [],
                    draftTimeLimit: 30,

                    // Calificación
                    gradingAttempt: null,
                    gradingQuestions: [],

                    // Registro profesor
                    teacherEmail: '',
                    teacherPass: '',
                    teacherName: '',
                    teacherSignupCode: '',

                    // Registro estudiante
                    studentEmail: '',
                    studentPass: '',
                    studentName: '',
                    studentId: '',
                    studentCourse: '',

                    // Resultados
                    resultsExam: null,
                    resultsList: [],
                    openAttempt: null,
                    stats: null
                };

                // Escuchar cambios de autenticación
                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        this.state.authUser = user;
                        const teacherData = await FirebaseService.getTeacher(user.uid);
                        if (teacherData) {
                            this.state.userRole = 'teacher';
                            this.state.teacherData = teacherData;
                            this.state.view = 'teacher-courses';
                            this.state.selectedCourse = null;
                            this.state.selectedPartial = null;
                            this.render();
                            return;
                        }
                        const studentData = await FirebaseService.getStudent(user.uid);
                        if (studentData) {
                            this.state.userRole = 'student';
                            this.state.loggedStudent = studentData;
                            this.state.selectedCourse = studentData.courseId || null;
                            this.loadStudentAttempts(user.uid);
                            this.state.view = 'student-exams';
                            this.render();
                            return;
                        }
                        // Usuario sin rol
                        this.state.authUser = null;
                        this.state.userRole = null;
                        this.state.view = 'home';
                        this.render();
                    } else {
                        this.state.authUser = null;
                        this.state.userRole = null;
                        this.state.teacherData = null;
                        this.state.loggedStudent = null;
                        if (!['home', 'teacher-login', 'teacher-register', 'student-login', 'student-register'].includes(
                                this.state.view)) {
                            this.state.view = 'home';
                            this.render();
                        }
                    }
                });

                this.render();
            }

            // ============================================================
            // MÉTODOS DE ESTADO
            // ============================================================
            setState(newState) {
                Object.assign(this.state, newState);
                this.render();
                setTimeout(renderMath, 300);
            }

            setError(msg) { this.setState({ error: msg, success: '' }); }
            setSuccess(msg) { this.setState({ success: msg, error: '' }); }
            setBusy(busy) { this.setState({ busy: busy }); }

            // ============================================================
            // CARGA DE DATOS
            // ============================================================
            async loadExams(courseId, partialId) {
                try {
                    const exams = await FirebaseService.getExams(courseId, partialId);
                    this.state.exams = exams;
                    return exams;
                } catch (error) {
                    console.error('Error cargando exámenes:', error);
                    return [];
                }
            }

            async loadStudentAttempts(uid) {
                try {
                    const attempts = await FirebaseService.getAttemptsByStudent(uid);
                    this.state.attemptsOfStudent = attempts;
                    return attempts;
                } catch (error) {
                    console.error('Error cargando intentos:', error);
                    return [];
                }
            }

            // ============================================================
            // RENDER
            // ============================================================
            render() {
                const app = document.getElementById('app');
                const { view } = this.state;

                let html = '';
                switch (view) {
                    case 'home':
                        html = this.renderHome();
                        break;
                    case 'teacher-login':
                        html = this.renderTeacherLogin();
                        break;
                    case 'teacher-register':
                        html = this.renderTeacherRegister();
                        break;
                    case 'teacher-courses':
                        html = this.renderTeacherCourses();
                        break;
                    case 'teacher-partials':
                        html = this.renderTeacherPartials();
                        break;
                    case 'teacher-create-exam':
                        html = this.renderTeacherCreateExam();
                        break;
                    case 'teacher-grade-exam':
                        html = this.renderTeacherGradeExam();
                        break;
                    case 'teacher-results':
                        html = this.renderTeacherResults();
                        break;
                    case 'student-login':
                        html = this.renderStudentLogin();
                        break;
                    case 'student-register':
                        html = this.renderStudentRegister();
                        break;
                    case 'student-exams':
                        html = this.renderStudentExams();
                        break;
                    case 'student-taking-exam':
                        html = this.renderStudentTakingExam();
                        break;
                    case 'student-result':
                        html = this.renderStudentResult();
                        break;
                    case 'student-grades':
                        html = this.renderStudentGrades();
                        break;
                    default:
                        html = this.renderHome();
                }

                app.innerHTML = html;
                setTimeout(renderMath, 400);
            }

            // --- TEACHER RESULTS (Detalle de intentos) ---
            renderTeacherResults() {
                const { resultsExam, resultsList, stats, openAttempt } = this.state;

                if (!resultsExam) {
                    return `<div class="flex-center" style="min-height:50vh;"><div class="spinner-chalk"></div></div>`;
                }

                return `
                    <div>
                        <div class="flex-between" style="margin-bottom:16px;">
                            <div>
                                <button class="btn-chalk" onclick="app.goToTeacherGradeExam()" style="padding:6px 16px;font-size:0.9rem;">← Volver</button>
                                <h2 class="chalk-title" style="font-size:2rem;margin-top:6px;">📊 Resultados: ${resultsExam.title}</h2>
                                <p class="chalk-subtitle">${resultsList.length} intentos ${stats ? `· Promedio: ${stats.avg.toFixed(1)}%` : ''}</p>
                            </div>
                        </div>

                        ${resultsList.length === 0 ? `
                            <div class="text-center" style="padding:40px 0;">
                                <div style="font-size:4rem;opacity:0.3;">👥</div>
                                <p class="chalk-text">Nadie ha respondido este examen todavía.</p>
                            </div>
                        ` : `
                            ${resultsList.map(r => {
                                const pct = (r.score / r.total * 100);
                                const isGraded = r.gradingStatus === 'graded';
                                const finalPct = isGraded ? (r.finalGrade / r.total * 100) : null;
                                const passed = isGraded ? finalPct >= 60 : pct >= 60;
                                const id = r.id || r.studentId || 'unknown';
                                return `
                                    <div style="margin-bottom:4px;">
                                        <div class="exam-item-chalk" style="cursor:pointer;border-left-color:${isGraded ? (passed ? 'var(--chalk-green)' : 'var(--chalk-red)') : 'var(--chalk-orange)'};background:${openAttempt === id ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)'};" onclick="app.toggleAttempt('${id}')">
                                            <div class="flex" style="align-items:center;gap:12px;flex-wrap:wrap;">
                                                <span>${isGraded ? (passed ? '✅' : '❌') : '⏳'}</span>
                                                <div>
                                                    <div class="exam-title" style="font-size:1rem;">${r.studentName}</div>
                                                    <div class="exam-meta">${formatDate(r.submittedAt)}</div>
                                                </div>
                                                <div class="flex" style="gap:12px;flex-wrap:wrap;">
                                                    <span class="chalk-small">Provisional: ${r.score}/${r.total} (${pct.toFixed(0)}%)</span>
                                                    ${isGraded ? `
                                                        <span class="chalk-small" style="color:${passed ? 'var(--chalk-green)' : 'var(--chalk-red)'};font-weight:bold;">
                                                            Final: ${r.finalGrade}/${r.total} (${finalPct.toFixed(0)}%)
                                                        </span>
                                                    ` : `
                                                        <span class="badge-chalk pending">Pendiente</span>
                                                    `}
                                                </div>
                                            </div>
                                            <div class="flex" style="gap:6px;">
                                                ${!isGraded ? `
                                                    <button class="btn-chalk btn-chalk-warning" onclick="event.stopPropagation();app.goToGrade('${r.id}')" style="padding:4px 14px;font-size:0.8rem;border-color:var(--chalk-orange);color:var(--chalk-orange);">✏️ Calificar</button>
                                                ` : `
                                                    <button class="btn-chalk btn-chalk-blue" onclick="event.stopPropagation();app.goToGrade('${r.id}')" style="padding:4px 14px;font-size:0.8rem;">📝 Revisar</button>
                                                `}
                                            </div>
                                        </div>
                                        ${openAttempt === id ? `
                                            <div style="padding:12px 16px 12px 32px;border-left:3px solid var(--chalk-yellow);background:rgba(255,255,255,0.03);border-radius:0 0 8px 8px;">
                                                ${r.details.map((d, i) => `
                                                    <div class="flex" style="align-items:flex-start;gap:8px;padding:3px 0;">
                                                        <span>${d.correct ? '✅' : '❌'}</span>
                                                        <div>
                                                            <div class="math-text" style="font-size:0.95rem;">${d.text}</div>
                                                            <div class="chalk-small" style="font-family:monospace;">
                                                                ${d.type === 'sa' ? `Respondió: ${d.shortAnswer || '—'}` : `Respondió: ${d.options?.[d.chosen] || '—'}`}
                                                                ${!d.correct && d.correctIndex !== undefined ? ` · Correcta: ${d.options?.[d.correctIndex] || d.correctAnswer || '—'}` : ''}
                                                            </div>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                                ${r.teacherComments && r.teacherComments.length > 0 ? `
                                                    <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);">
                                                        <div class="chalk-small" style="font-weight:bold;">💬 Comentarios del profesor:</div>
                                                        ${r.teacherComments.map(c => `
                                                            <div class="comment-box" style="background:rgba(255,255,255,0.04);border-radius:6px;padding:8px 14px;margin-top:4px;border-left:2px solid var(--chalk-yellow);">
                                                                <div class="comment-text" style="font-size:0.9rem;">${c.text}</div>
                                                                <div class="comment-date" style="font-size:0.7rem;opacity:0.5;">${c.teacherName} · ${formatDate(c.date)}</div>
                                                            </div>
                                                        `).join('')}
                                                    </div>
                                                ` : ''}
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        `}
                    </div>
                `;
            }

            // --- STUDENT REGISTER ---
            renderStudentRegister() {
                const { error, success, busy, studentEmail, studentPass, studentName, studentId, studentCourse } = this.state;
                return `
                    <div class="flex-center flex-col" style="max-width:420px;margin:20px auto;">
                        <h2 class="chalk-title" style="font-size:2.4rem;">📝 Registro Estudiante</h2>
                        <p class="chalk-subtitle" style="font-size:1rem;">Crea tu cuenta y elige tu curso</p>

                        <div class="input-chalk-label">ID de estudiante (carné)</div>

                    </div>
                `;

            // --- STUDENT EXAMS (Lista de exámenes disponibles) ---
            renderStudentExams() {
                const { loggedStudent, exams, attemptsOfStudent } = this.state;
                const course = COURSES.find(c => c.id === loggedStudent?.courseId);

                const available = exams.filter(e => !attemptsOfStudent.some(a => a.examId === e.id));
                const completed = exams.filter(e => attemptsOfStudent.some(a => a.examId === e.id));

                return `
                    <div>
                        <div class="flex-between" style="margin-bottom:16px;">
                            <div>
                                <h2 class="chalk-title" style="font-size:2.4rem;">📚 ${course?.name || 'Mis Exámenes'}</h2>
                                <p class="chalk-subtitle">👨‍🎓 ${loggedStudent?.name || 'Estudiante'} · ${available.length} disponibles · ${completed.length} completados</p>
                            </div>
                            <div class="flex" style="gap:10px;">
                                <button class="btn-chalk" onclick="app.goToStudentGrades()" style="border-color:var(--chalk-yellow);color:var(--chalk-yellow);padding:6px 16px;font-size:0.9rem;">📊 Mis notas</button>
                                <button class="btn-chalk" onclick="app.logout()" style="padding:6px 16px;font-size:0.9rem;">🚪 Salir</button>
                            </div>
                        </div>

                        <h3 class="chalk-text" style="font-size:1.3rem;margin:16px 0 10px;">📝 Exámenes disponibles</h3>
                        ${available.length === 0 ? `
                            <div class="text-center" style="padding:20px 0;">
                                <p class="chalk-text">🎉 ¡Has completado todos los exámenes!</p>
                            </div>
                        ` : `
                            ${available.map(e => {
                                const partial = PARTIALS.find(p => p.id === e.partialId);
                                return `
                                    <div class="exam-item-chalk" style="border-left-color:var(--chalk-blue);">
                                        <div>
                                            <div class="exam-title">${e.title}</div>
                                            <div class="exam-meta">${partial?.name || `Parcial ${e.partialId}`} · ${e.questions?.length || 0} preguntas · ${e.timeLimit || 30} min</div>
                                        </div>
                                        <button class="btn-chalk btn-chalk-primary" onclick="app.startExam('${e.id}')" style="padding:6px 20px;font-size:0.95rem;">▶️ Empezar</button>
                                    </div>
                                `;
                            }).join('')}
                        `}

                        ${completed.length > 0 ? `
                            <h3 class="chalk-text" style="font-size:1.3rem;margin:20px 0 10px;">✅ Exámenes completados</h3>
                            ${completed.map(e => {
                                const attempt = attemptsOfStudent.find(a => a.examId === e.id);
                                if (!attempt) return '';
                                const pct = (attempt.score / attempt.total * 100);
                                const isGraded = attempt.gradingStatus === 'graded';
                                const finalPct = isGraded ? (attempt.finalGrade / attempt.total * 100) : null;
                                const passed = isGraded ? finalPct >= 60 : pct >= 60;
                                return `
                                    <div class="exam-item-chalk" style="border-left-color:${isGraded ? (passed ? 'var(--chalk-green)' : 'var(--chalk-red)') : 'var(--chalk-orange)'};">
                                        <div>
                                            <div class="exam-title">${e.title}</div>
                                            <div class="exam-meta">
                                                Provisional: ${attempt.score}/${attempt.total} (${pct.toFixed(0)}%)
                                                ${isGraded ? `
                                                    · <span style="color:${passed ? 'var(--chalk-green)' : 'var(--chalk-red)'};font-weight:bold;">
                                                        Final: ${attempt.finalGrade}/${attempt.total} (${finalPct.toFixed(0)}%) ${passed ? '✅' : '❌'}
                                                    </span>
                                                ` : `
                                                    · <span class="badge-chalk pending">⏳ Pendiente</span>
                                                `}
                                            </div>
                                        </div>
                                        <span style="font-size:1.5rem;">${isGraded ? (passed ? '🎉' : '📚') : '⏳'}</span>
                                    </div>
                                `;
                            }).join('')}
                        ` : ''}
                    </div>
                `;
            }

            // --- STUDENT TAKING EXAM ---
            renderStudentTakingExam() {
                const { activeExam, answers, error, timeRemaining, busy } = this.state;
                if (!activeExam) {
                    return `<div class="flex-center" style="min-height:50vh;"><div class="spinner-chalk"></div></div>`;
                }
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                const isLow = timeRemaining < 60;

                return `
                    <div>
                        <div class="flex-between" style="margin-bottom:16px;">
                            <div>
                                <h2 class="chalk-title" style="font-size:2rem;">📝 ${activeExam.title}</h2>
                                <p class="chalk-subtitle">${Object.keys(answers).length}/${activeExam.questions.length} respondidas</p>
                            </div>
                            <div class="timer-chalk ${isLow ? 'warning' : ''}">
                                ⏱️ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}
                            </div>
                        </div>

                        ${error ? `<div class="msg-chalk error">⚠️ ${error}</div>` : ''}

                        ${activeExam.questions.map((q, qi) => `
                            <div style="margin-bottom:16px;padding:16px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.06);">
                                <div style="font-weight:500;color:var(--chalk-bright);margin-bottom:8px;" class="math-text">${qi + 1}. ${q.text}</div>
                                ${q.type === 'sa' ? `
                                    <div>
                                        <textarea class="input-chalk" rows="2" placeholder="Escribe tu respuesta aquí..." oninput="app.setShortAnswer('${q.id}', this.value)" style="font-size:1rem;">${answers[q.id] || ''}</textarea>
                                        <div class="chalk-small" style="margin-top:4px;opacity:0.5;">📝 Respuesta corta</div>
                                    </div>
                                ` : q.options.map((opt, oi) => `
                                    <label class="radio-option" style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;cursor:pointer;transition:background 0.2s;">
                                        <input type="radio" name="q_${q.id}" ${answers[q.id] === oi ? 'checked' : ''} onchange="app.setAnswer('${q.id}', ${oi})" style="width:18px;height:18px;accent-color:var(--chalk-yellow);cursor:pointer;" />
                                        <span class="chalk-text">${opt}</span>
                                    </label>
                                `).join('')}
                            </div>
                        `).join('')}

                        <div class="flex" style="gap:12px;flex-wrap:wrap;margin-top:8px;">
                            <button class="btn-chalk btn-chalk-primary" onclick="app.submitExam()" ${busy ? 'disabled' : ''}>
                                ${busy ? '⏳ Enviando...' : '📤 Enviar examen'}
                            </button>
                            <button class="btn-chalk" onclick="if(confirm('¿Seguro que quieres salir? Perderás tu progreso.')) app.cancelExam()">Cancelar</button>
                        </div>
                    </div>
                `;
            }

            // --- STUDENT RESULT ---
            renderStudentResult() {
                const { result } = this.state;
                if (!result) {
                    return `<div class="flex-center" style="min-height:50vh;"><div class="spinner-chalk"></div></div>`;
                }
                const pct = (result.score / result.total * 100);
                const passed = pct >= 60;

                return `
                    <div>
                        <div class="flex-between" style="margin-bottom:16px;">
                            <div>
                                <h2 class="chalk-title" style="font-size:2rem;">📊 Resultado Provisional</h2>
                                <p class="chalk-subtitle">${result.examTitle}</p>
