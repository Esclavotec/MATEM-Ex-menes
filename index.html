                            </div>

                            <div style="margin-bottom:12px;padding:12px 16px;background:#F8FAFC;border-radius:8px;border:1px solid #E2E8F0;">
                                <span style="font-size:0.85rem;color:#64748B;">📐 Puedes usar <strong>MathJax</strong> para ecuaciones: <code>\$x^2 + y^2 = r^2\$</code></span>
                            </div>

                            ${draftQuestions.map((q, qi) => `
                                <div class="question-block">
                                    <div class="question-header">
                                        <span>PREGUNTA ${qi + 1} · ${q.type === 'tf' ? 'Verdadero/Falso' : q.type === 'sa' ? 'Respuesta Corta' : 'Opción múltiple'}</span>
                                        <button class="btn btn-danger" onclick="app.removeDraftQuestion('${q.id}')" style="padding:4px 12px;font-size:0.8rem;">🗑️</button>
                                    </div>
                                    <div class="input-group" style="margin-bottom:8px;">
                                        <label style="font-size:0.8rem;">Enunciado (puedes usar \$...\$ para matemáticas)</label>
                                        <input type="text" value="${q.text}" oninput="app.updateDraftQuestion('${q.id}', { text: this.value })" placeholder="Ej: Resuelve la ecuación \$2x + 3 = 7\$" style="width:100%;padding:8px 12px;border:1px solid #E2E8F0;border-radius:6px;outline:none;font-size:1rem;background:white;" />
                                    </div>
                                    
                                    ${q.type === 'sa' ? `
                                        <div style="padding:8px 12px;background:#EEF2FF;border-radius:6px;border:1px dashed #E2E8F0;">
                                            <span style="font-size:0.85rem;color:#64748B;">📝 Respuesta corta</span>
                                            <div style="margin-top:8px;">
                                                <label style="font-size:0.75rem;color:#64748B;">Respuesta correcta (el sistema validará automáticamente):</label>
                                                <input type="text" value="${q.correctAnswer || ''}" oninput="app.updateDraftQuestion('${q.id}', { correctAnswer: this.value })" placeholder="Ej: x = 2" style="width:100%;padding:6px 12px;border:1px solid #E2E8F0;border-radius:4px;margin-top:4px;font-size:0.9rem;" />
                                            </div>
                                            <div style="margin-top:6px;">
                                                <label style="font-size:0.75rem;color:#64748B;">Palabras clave adicionales (separadas por coma):</label>
                                                <input type="text" value="${q.keywords || ''}" oninput="app.updateDraftQuestion('${q.id}', { keywords: this.value })" placeholder="Ej: función, lineal, pendiente" style="width:100%;padding:6px 12px;border:1px solid #E2E8F0;border-radius:4px;margin-top:4px;font-size:0.9rem;" />
                                            </div>
                                            <div style="font-size:0.7rem;color:#64748B;margin-top:4px;">💡 La respuesta se valida comparando con la respuesta correcta (ignorando espacios y mayúsculas)</div>
                                        </div>
                                    ` : q.options.map((opt, oi) => `
                                        <div class="option-row">
                                            <input type="radio" ${q.correctIndex === oi ? 'checked' : ''} onchange="app.updateDraftQuestion('${q.id}', { correctIndex: ${oi} })" />
                                            <input type="text" value="${opt}" oninput="app.updateOption('${q.id}', ${oi}, this.value)" placeholder="Opción ${oi + 1}" />
                                        </div>
                                    `).join('')}
                                    
                                    ${q.type !== 'sa' ? `
                                        <div style="font-size:0.7rem;color:#64748B;font-family:monospace;margin-top:4px;">Marca el círculo de la respuesta correcta</div>
                                    ` : ''}
                                </div>
                            `).join('')}

                            <div style="display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;">
                                <button class="btn btn-secondary" onclick="app.addDraftQuestion('mc')">➕ Opción múltiple</button>
                                <button class="btn btn-secondary" onclick="app.addDraftQuestion('tf')">➕ Verdadero/Falso</button>
                                <button class="btn btn-secondary" onclick="app.addDraftQuestion('sa')">➕ Respuesta corta</button>
                            </div>

                            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                                <button class="btn btn-primary" onclick="app.saveDraftExam()" ${busy ? 'disabled' : ''}>
                                    ${busy ? '⏳ Guardando...' : '💾 Guardar examen'}
                                </button>
                                <button class="btn btn-ghost" onclick="app.goToTeacherDashboard()">Cancelar</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- TEACHER RESULTS ---
            renderTeacherResults() {
                const { resultsExam, resultsList, stats, openAttempt } = this.state;

                if (!resultsExam) {
                    return `
                        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
                            <div class="spinner"></div>
                        </div>
                    `;
                }

                return `
                    <div class="header">
                        <h1>📊 MATEM</h1>
                        <div class="header-buttons">
                            <button class="btn btn-outline" onclick="app.goToTeacherDashboard()">← Volver</button>
                        </div>
                    </div>

                    <div class="container">
                        <div class="card">
                            <h2 class="card-title">Resultados: ${resultsExam.title}</h2>
                            <p class="card-subtitle">${resultsList.length} intentos ${stats ? `· Promedio provisional: ${stats.avg.toFixed(1)}% · Aprobados: ${stats.passRate.toFixed(1)}%` : ''}</p>

                            ${resultsList.length === 0 ? `
                                <div class="text-center" style="padding:40px 0;">
                                    <div style="font-size:4rem;">👥</div>
                                    <p style="color:#64748B;">Nadie ha respondido este examen todavía.</p>
                                </div>
                            ` : `
                                ${resultsList.map(r => {
                                    const pct = (r.score / r.total * 100);
                                    const isGraded = r.gradingStatus === 'graded';
                                    const finalPct = isGraded ? (r.finalGrade / r.total * 100) : null;
                                    const passed = isGraded ? finalPct >= 60 : pct >= 60;
                                    const id = r.id || r.studentId || 'unknown';
                                    return `
                                        <div style="margin-bottom:4px;">
                                            <div class="exam-item" style="cursor:pointer;background:${openAttempt === id ? '#EEF2FF' : '#F8FAFC'};" onclick="app.toggleAttempt('${id}')">
                                                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                                                    <span>${isGraded ? (passed ? '✅' : '❌') : '⏳'}</span>
                                                    <div>
                                                        <div style="font-weight:500;color:#0F172A;">${r.studentName}</div>
                                                        <div style="font-size:0.75rem;color:#64748B;">${formatDate(r.submittedAt)}</div>
                                                    </div>
                                                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                                                        <span style="font-family:monospace;font-size:0.85rem;color:#64748B;">
                                                            Provisional: ${r.score}/${r.total} (${pct.toFixed(0)}%)
                                                        </span>
                                                        ${isGraded ? `
                                                            <span style="font-family:monospace;font-size:0.85rem;font-weight:600;${passed ? 'color:#16A34A;' : 'color:#DC2626;'}">
                                                                Final: ${r.finalGrade}/${r.total} (${finalPct.toFixed(0)}%)
                                                            </span>
                                                        ` : `
                                                            <span class="grade-badge pending">Pendiente</span>
                                                        `}
                                                    </div>
                                                </div>
                                                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                                    ${!isGraded ? `
                                                        <button class="btn btn-warning" onclick="event.stopPropagation();app.goToGrade('${r.id}')" style="padding:4px 12px;font-size:0.8rem;">✏️ Calificar</button>
                                                    ` : `
                                                        <button class="btn btn-secondary" onclick="event.stopPropagation();app.goToGrade('${r.id}')" style="padding:4px 12px;font-size:0.8rem;">📝 Revisar</button>
                                                    `}
                                                </div>
                                            </div>
                                            ${openAttempt === id ? `
                                                <div style="padding:12px 16px 12px 32px;border-left:3px solid #4F46E5;background:#EEF2FF;border-radius:0 0 8px 8px;">
                                                    ${r.details.map((d, i) => `
                                                        <div style="display:flex;align-items:flex-start;gap:8px;padding:3px 0;">
                                                            <span>${d.correct ? '✅' : '❌'}</span>
                                                            <div style="font-size:0.9rem;color:#334155;">
                                                                <div class="math-text">${d.text}</div>
                                                                <div style="font-size:0.75rem;color:#64748B;font-family:monospace;">
                                                                    ${d.type === 'sa' ? `Respondió: ${d.shortAnswer || '—'}` : `Respondió: ${d.options?.[d.chosen] || '—'}`}
                                                                    ${!d.correct && d.correctIndex !== undefined ? ` · Correcta: ${d.options?.[d.correctIndex] || d.correctAnswer || '—'}` : ''}
                                                                    ${d.type === 'sa' && d.correctAnswer ? ` · Respuesta esperada: ${d.correctAnswer}` : ''}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    `).join('')}
                                                    
                                                    ${r.teacherComments && r.teacherComments.length > 0 ? `
                                                        <div style="margin-top:12px;padding-top:12px;border-top:1px solid #E2E8F0;">
                                                            <div style="font-size:0.85rem;font-weight:600;color:#0F172A;">💬 Comentarios del profesor:</div>
                                                            ${r.teacherComments.map(c => `
                                                                <div class="comment-box">
                                                                    <div class="comment-text">${c.text}</div>
                                                                    <div class="comment-date">${c.teacherName} · ${formatDate(c.date)}</div>
                                                                </div>
                                                            `).join('')}
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            ` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            `}
                        </div>
                    </div>
                `;
            }

            // --- TEACHER GRADE ---
            renderTeacherGrade() {
                const { gradingAttempt, gradingQuestions, error, success, busy } = this.state;

                if (!gradingAttempt) {
                    return `
                        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
                            <div class="spinner"></div>
                        </div>
                    `;
                }

                return `
                    <div class="header">
                        <h1>✏️ MATEM</h1>
                        <div class="header-buttons">
                            <button class="btn btn-outline" onclick="app.goToTeacherResults()">← Volver</button>
                        </div>
                    </div>

                    <div class="container">
                        <div class="card">
                            <h2 class="card-title">Calificar: ${gradingAttempt.examTitle}</h2>
                            <p class="card-subtitle">Estudiante: ${gradingAttempt.studentName} · Provisional: ${gradingAttempt.score}/${gradingAttempt.total}</p>

                            ${error ? `<div class="error-msg">⚠️ ${error}</div>` : ''}
                            ${success ? `<div class="success-msg">✅ ${success}</div>` : ''}

                            ${gradingQuestions.map((q, qi) => `
                                <div style="margin-bottom:16px;padding:16px;background:#F8FAFC;border-radius:10px;border:1px solid #E2E8F0;">
                                    <div style="font-weight:500;color:#0F172A;margin-bottom:8px;" class="math-text">${qi + 1}. ${q.text}</div>
                                    <div style="font-size:0.9rem;color:#334155;padding:8px 12px;background:white;border-radius:6px;margin-bottom:8px;">
                                        <strong>Respuesta del estudiante:</strong> ${q.type === 'sa' ? (q.shortAnswer || '—') : (q.options?.[q.chosen] || '—')}
                                    </div>
                                    ${q.type === 'sa' ? `
                                        <div style="margin-bottom:8px;">
                                            <label style="font-size:0.85rem;color:#64748B;">Respuesta correcta esperada: <strong>${q.correctAnswer || 'No definida'}</strong></label>
                                        </div>
                                        <div class="input-group" style="margin-bottom:8px;">
                                            <label style="font-size:0.85rem;color:#64748B;">¿Es correcta?</label>
                                            <select onchange="app.updateGradingQuestion(${qi}, this.value === 'true')">
                                                <option value="true" ${q.gradingCorrect === true ? 'selected' : ''}>✅ Correcta</option>
                                                <option value="false" ${q.gradingCorrect === false ? 'selected' : ''}>❌ Incorrecta</option>
                                            </select>
                                        </div>
                                    ` : `
                                        <div style="font-size:0.85rem;color:#64748B;">
                                            Correcta: ${q.options?.[q.correctIndex] || '—'}
                                        </div>
                                        <div style="margin-top:4px;">
                                            <span style="font-size:0.85rem;font-weight:600;${q.correct ? 'color:#16A34A;' : 'color:#DC2626;'}">
                                                ${q.correct ? '✅ Correcta' : '❌ Incorrecta'}
                                            </span>
                                        </div>
                                    `}
                                </div>
                            `).join('')}

                            <div class="input-group">
                                <label>Comentario para el estudiante</label>
                                <textarea rows="3" id="teacherCommentInput" placeholder="Escribe aquí tus observaciones sobre el examen..." style="width:100%;padding:12px 16px;border:1px solid #E2E8F0;border-radius:8px;font-family:inherit;font-size:1rem;resize:vertical;"></textarea>
                            </div>

                            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                                <button class="btn btn-success" onclick="app.saveGrade()" ${busy ? 'disabled' : ''}>
                                    ${busy ? '⏳ Guardando...' : '💾 Guardar calificación final'}
                                </button>
                                <button class="btn btn-ghost" onclick="app.goToTeacherResults()">Cancelar</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- STUDENT LIST ---
            renderStudentList() {
                const { exams, loggedStudent, attemptsOfStudent } = this.state;

                const available = exams.filter(e => !attemptsOfStudent.some(a => a.examId === e.id));
                const completed = exams.filter(e => attemptsOfStudent.some(a => a.examId === e.id));

                return `
                    <div class="header">
                        <h1>🎓 MATEM</h1>
                        <div class="header-buttons">
                            <span style="color:#F8FAFC;font-size:0.9rem;">👨‍🎓 ${loggedStudent?.name || 'Estudiante'}</span>
                            <button class="btn btn-outline" onclick="app.goToStudentGrades()" style="border-color:#D97706;color:#D97706;">📊 Mis notas</button>
                            <button class="btn btn-outline" onclick="app.goToHome()">🏠 Inicio</button>
                            <button class="btn btn-danger" onclick="app.logout()">🚪 Salir</button>
                        </div>
                    </div>

                    <div class="container">
                        <div class="card">
                            <div class="flex-between">
                                <div>
                                    <h2 class="card-title">Hola, ${loggedStudent?.name || 'Estudiante'}</h2>
                                    <p class="card-subtitle">${available.length} exámenes disponibles · ${completed.length} completados</p>
                                </div>
                            </div>

                            <h3 style="font-weight:600;color:#0F172A;margin:16px 0 10px;">📝 Exámenes disponibles</h3>
                            ${available.length === 0 ? `
                                <div class="text-center" style="padding:20px 0;">
                                    <p style="color:#64748B;">🎉 ¡Has completado todos los exámenes!</p>
                                </div>
                            ` : `
                                ${available.map(e => {
                                    const part = COURSE_PARTS.find(p => p.id === e.part);
                                    return `
                                        <div class="exam-item">
                                            <div>
                                                <div class="exam-title">${e.title}</div>
                                                <div class="exam-meta">${part?.title || `Parte ${e.part}`} · ${e.questions?.length || 0} preguntas · ${e.timeLimit || 30} min</div>
                                            </div>
                                            <button class="btn btn-primary" onclick="app.startExam('${e.id}')">▶️ Empezar</button>
                                        </div>
                                    `;
                                }).join('')}
                            `}

                            ${completed.length > 0 ? `
                                <h3 style="font-weight:600;color:#0F172A;margin:20px 0 10px;">✅ Exámenes completados</h3>
                                ${completed.map(e => {
                                    const attempt = attemptsOfStudent.find(a => a.examId === e.id);
                                    if (!attempt) return '';
                                    const pct = (attempt.score / attempt.total * 100);
                                    const isGraded = attempt.gradingStatus === 'graded';
                                    const finalPct = isGraded ? (attempt.finalGrade / attempt.total * 100) : null;
                                    const passed = isGraded ? finalPct >= 60 : pct >= 60;
                                    return `
                                        <div class="exam-item">
                                            <div>
                                                <div class="exam-title">${e.title}</div>
                                                <div style="font-family:monospace;font-size:0.9rem;">
                                                    <span style="color:#64748B;">Provisional: ${attempt.score}/${attempt.total} (${pct.toFixed(0)}%)</span>
                                                    ${isGraded ? `
                                                        <span style="margin-left:12px;font-weight:600;${passed ? 'color:#16A34A;' : 'color:#DC2626;'}">
                                                            Final: ${attempt.finalGrade}/${attempt.total} (${finalPct.toFixed(0)}%) ${passed ? '✅' : '❌'}
                                                        </span>
                                                    ` : `
                                                        <span class="grade-badge pending" style="margin-left:12px;">⏳ Pendiente de calificar</span>
                                                    `}
                                                </div>
                                            </div>
                                            <span style="font-size:1.5rem;">${isGraded ? (passed ? '🎉' : '📚') : '⏳'}</span>
                                        </div>
                                    `;
                                }).join('')}
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            // --- STUDENT EXAM ---
            renderStudentExam() {
                const { activeExam, answers, error, timeRemaining, busy } = this.state;

                if (!activeExam) {
                    return `
                        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
                            <div class="spinner"></div>
                        </div>
                    `;
                }

                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                const isLow = timeRemaining < 60;

                return `
                    <div class="header">
                        <h1>📝 MATEM</h1>
                        <div class="header-buttons">
                            <div class="timer ${isLow ? 'timer-warning' : ''}">
                                ⏱️ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}
                            </div>
                        </div>
                    </div>

                    <div class="container">
                        <div class="card">
                            <div class="flex-between">
                                <div>
                                    <h2 class="card-title">${activeExam.title}</h2>
                                    <p class="card-subtitle">${Object.keys(answers).length}/${activeExam.questions.length} respondidas</p>
                                </div>
                            </div>

                            ${error ? `<div class="error-msg">⚠️ ${error}</div>` : ''}

                            ${activeExam.questions.map((q, qi) => `
                                <div style="margin-bottom:16px;padding:16px;background:#F8FAFC;border-radius:10px;">
                                    <div style="font-weight:500;color:#0F172A;margin-bottom:8px;" class="math-text">${qi + 1}. ${q.text}</div>
                                    
                                    ${q.type === 'sa' ? `
                                        <div>
                                            <textarea class="short-answer-input" rows="2" placeholder="Escribe tu respuesta aquí..." oninput="app.setShortAnswer('${q.id}', this.value)">${answers[q.id] || ''}</textarea>
                                            <div style="font-size:0.7rem;color:#64748B;margin-top:4px;">📝 Respuesta corta - Escribe tu respuesta en detalle</div>
                                        </div>
                                    ` : q.options.map((opt, oi) => `
                                        <label class="radio-option">
                                            <input type="radio" name="q_${q.id}" ${answers[q.id] === oi ? 'checked' : ''} onchange="app.setAnswer('${q.id}', ${oi})" />
                                            <span>${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            `).join('')}

                            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;">
                                <button class="btn btn-primary" onclick="app.submitExam()" ${busy ? 'disabled' : ''}>
                                    ${busy ? '⏳ Enviando...' : '📤 Enviar examen'}
                                </button>
                                <button class="btn btn-ghost" onclick="if(confirm('¿Seguro que quieres salir? Perderás tu progreso.')) app.cancelExam()">Cancelar</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- STUDENT RESULT ---
            renderStudentResult() {
                const { result } = this.state;

                if (!result) {
                    return `
                        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
                            <div class="spinner"></div>
                        </div>
                    `;
                }

                const pct = (result.score / result.total * 100);
                const passed = pct >= 60;

                return `
                    <div class="header">
                        <h1>🎓 MATEM</h1>
                        <div class="header-buttons">
                            <button class="btn btn-outline" onclick="app.goToStudentList()">← Volver</button>
                        </div>
                    </div>

                    <div class="container">
                        <div class="card">
                            <h2 class="card-title">📊 Resultado Provisional</h2>
                            <p class="card-subtitle">${result.examTitle}</p>

                            <div class="text-center">
                                <div class="score-circle ${passed ? 'passed' : 'failed'}">
                                    <span class="score-number ${passed ? 'text-success' : 'text-danger'}">${pct.toFixed(0)}%</span>
                                    <span class="score-label ${passed ? 'text-success' : 'text-danger'}">${result.score}/${result.total}</span>
                                </div>
                                <div style="font-size:1.2rem;font-weight:600;${passed ? 'color:#16A34A;' : 'color:#DC2626;'}">
                                    ${passed ? '🎉 ¡Aprobado!' : '📚 Reprobado - Sigue practicando'}
                                </div>
                                <div style="font-size:0.85rem;color:#64748B;margin-top:8px;">
                                    ⏳ Este resultado es provisional. El profesor lo revisará y dará una nota final.
                                </div>
                            </div>

                            <div style="margin-top:20px;">
                                ${result.details.map((d, i) => `
                                    <div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0;">
                                        <span>${d.correct ? '✅' : '❌'}</span>
                                        <div style="font-size:0.9rem;color:#334155;">
                                            <div class="math-text">${d.text}</div>
                                            <div style="font-size:0.75rem;color:#64748B;font-family:monospace;">
                                                ${d.type === 'sa' ? `Tu respuesta: ${d.shortAnswer || '—'}` : `Tu respuesta: ${d.options?.[d.chosen] || '—'}`}
                                                ${!d.correct && d.correctIndex !== undefined ? ` · Correcta: ${d.options?.[d.correctIndex] || d.correctAnswer || '—'}` : ''}
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <button class="btn btn-primary mt-4" onclick="app.goToStudentList()">← Volver a exámenes</button>
                        </div>
                    </div>
                `;
            }

            // --- STUDENT GRADES ---
            renderStudentGrades() {
                const { attemptsOfStudent, loggedStudent } = this.state;

                return `
                    <div class="header">
                        <h1>📊 MATEM</h1>
                        <div class="header-buttons">
                            <span style="color:#F8FAFC;font-size:0.9rem;">👨‍🎓 ${loggedStudent?.name || 'Estudiante'}</span>
                            <button class="btn btn-outline" onclick="app.goToStudentList()">← Volver</button>
                            <button class="btn btn-danger" onclick="app.logout()">🚪 Salir</button>
                        </div>
                    </div>

                    <div class="container">
                        <div class="card">
                            <h2 class="card-title">📊 Mis Calificaciones</h2>
                            <p class="card-subtitle">Resumen de todas tus notas y comentarios</p>

                            ${attemptsOfStudent.length === 0 ? `
                                <div class="text-center" style="padding:40px 0;">
                                    <div style="font-size:4rem;">📄</div>
                                    <p style="color:#64748B;">Aún no has completado ningún examen.</p>
                                </div>
                            ` : `
                                ${attemptsOfStudent.map((attempt, index) => {
                                    const pct = (attempt.score / attempt.total * 100);
                                    const isGraded = attempt.gradingStatus === 'graded';
                                    const finalPct = isGraded ? (attempt.finalGrade / attempt.total * 100) : null;
                                    const passed = isGraded ? finalPct >= 60 : pct >= 60;
                                    const part = COURSE_PARTS.find(p => p.id === attempt.part);
                                    
                                    return `
                                        <div class="student-grade-summary" style="${index > 0 ? 'border-top:1px solid #E2E8F0;padding-top:16px;' : ''}">
                                            <div class="flex-between">
                                                <div>
                                                    <div style="font-weight:600;color:#0F172A;">${attempt.examTitle}</div>
                                                    <div style="font-size:0.85rem;color:#64748B;">${part?.title || `Parte ${attempt.part}`} · ${formatDate(attempt.submittedAt)}</div>
                                                </div>
                                                <div style="text-align:right;">
                                                    <div style="font-size:0.85rem;color:#64748B;">
                                                        Provisional: ${attempt.score}/${attempt.total} (${pct.toFixed(0)}%)
                                                    </div>
                                                    ${isGraded ? `
                                                        <div style="font-size:1.1rem;font-weight:700;${passed ? 'color:#16A34A;' : 'color:#DC2626;'}">
                                                            Final: ${attempt.finalGrade}/${attempt.total} (${finalPct.toFixed(0)}%) ${passed ? '✅' : '❌'}
                                                        </div>
                                                    ` : `
                                                        <div class="grade-badge pending">⏳ Pendiente de calificar</div>
                                                    `}
                                                </div>
                                            </div>
                                            
                                            ${isGraded && attempt.teacherComments && attempt.teacherComments.length > 0 ? `
                                                <div style="margin-top:8px;">
                                                    <div style="font-size:0.85rem;font-weight:600;color:#0F172A;">💬 Comentarios del profesor:</div>
                                                    ${attempt.teacherComments.map(c => `
                                                        <div class="comment-box">
                                                            <div class="comment-text">${c.text}</div>
                                                            <div class="comment-date">${c.teacherName} · ${formatDate(c.date)}</div>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            ` : isGraded ? `
                                                <div style="margin-top:8px;font-size:0.85rem;color:#64748B;">Sin comentarios adicionales.</div>
                                            ` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            `}
                        </div>
                    </div>
                `;
            }

            // ============================================
            // ACCIONES
            // ============================================

            // --- Navegación ---
            goToHome() {
                this.setState({ view: 'home', error: '', success: '' });
            }

            goToTeacherLogin() {
                this.setState({ view: 'teacher-login', error: '', success: '', teacherEmail: '', teacherPass: '' });
            }

            goToTeacherRegister() {
                this.setState({ view: 'teacher-register', error: '', success: '', teacherEmail: '', teacherPass: '',
                    teacherName: '', teacherSignupCode: '' });
            }

            goToTeacherDashboard() {
                this.loadExams();
                this.setState({ view: 'teacher-dashboard', error: '', success: '' });
            }

            goToCreateExam(partId) {
                if (partId) this.state.draftPart = partId;
                this.setState({
                    view: 'teacher-create',
                    error: '',
                    success: '',
                    draftTitle: '',
                    draftQuestions: [],
                    draftTimeLimit: 30
                });
            }

            goToTeacherResults() {
                this.setState({ view: 'teacher-results', error: '', success: '' });
            }

            goToStudentLogin() {
                this.setState({ view: 'student-login', error: '', success: '', studentEmail: '', studentPass: '' });
            }

            goToStudentRegister() {
                this.setState({ view: 'student-register', error: '', success: '', studentEmail: '', studentPass: '',
                    studentName: '', studentId: '' });
            }

            goToStudentList() {
                this.loadExams();
                if (this.state.loggedStudent) {
                    this.loadStudentAttempts(this.state.loggedStudent.uid);
                }
                this.setState({ view: 'student-list', error: '', success: '' });
            }

            goToStudentGrades() {
                if (this.state.loggedStudent) {
                    this.loadStudentAttempts(this.state.loggedStudent.uid);
                }
                this.setState({ view: 'student-grades', error: '', success: '' });
            }

            togglePart(id) {
                this.setState({
                    selectedPart: this.state.selectedPart === id ? null : id
                });
            }

            toggleAttempt(id) {
                this.setState({
                    openAttempt: this.state.openAttempt === id ? null : id
                });
            }

            // --- Autenticación ---
            async handleTeacherLogin() {
                const { teacherEmail, teacherPass } = this.state;
                if (!teacherEmail || !teacherPass) {
                    return this.setError('Ingresa email y contraseña.');
                }

                this.setBusy(true);
                this.setError('');
                this.setSuccess('');

                try {
                    await FirebaseService.login(teacherEmail, teacherPass);
                    // El estado se actualizará en el listener de auth
                } catch (error) {
                    if (error.code === 'auth/user-not-found') {
                        this.setError('Usuario no encontrado. Regístrate primero.');
                    } else if (error.code === 'auth/wrong-password') {
                        this.setError('Contraseña incorrecta.');
                    } else {
                        this.setError('Error al iniciar sesión. Intenta nuevamente.');
                    }
                }

                this.setBusy(false);
            }

            async handleTeacherRegister() {
                const { teacherEmail, teacherPass, teacherName, teacherSignupCode } = this.state;

                if (!teacherName.trim() || !teacherEmail || !teacherPass) {
                    return this.setError('Completa todos los campos.');
                }
                if (teacherPass.length < 6) {
                    return this.setError('La contraseña debe tener al menos 6 caracteres.');
                }
                if (teacherSignupCode !== TEACHER_SIGNUP_CODE) {
                    return this.setError('❌ Código de verificación incorrecto. El código es: ' + TEACHER_SIGNUP_CODE);
                }

                this.setBusy(true);
                this.setError('');
                this.setSuccess('');

                try {
                    const user = await FirebaseService.register(teacherEmail, teacherPass);
                    await FirebaseService.saveTeacher({
                        uid: user.uid,
                        email: teacherEmail,
                        name: teacherName.trim(),
                        role: 'teacher'
                    });
                    this.setSuccess('✅ ¡Registro exitoso! Ahora puedes iniciar sesión.');
                    setTimeout(() => {
                        this.setState({ view: 'teacher-login', teacherEmail: '', teacherPass: '' });
                    }, 1500);
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') {
                        this.setError('Este email ya está registrado. Inicia sesión.');
                    } else {
                        this.setError('Error al registrarse. Intenta nuevamente.');
                    }
                }

                this.setBusy(false);
            }

            async handleStudentLogin() {
                const { studentEmail, studentPass } = this.state;
                if (!studentEmail || !studentPass) {
                    return this.setError('Completa todos los campos.');
                }

                this.setBusy(true);
                this.setError('');
                this.setSuccess('');

                try {
                    await FirebaseService.login(studentEmail, studentPass);
                    // El estado se actualizará en el listener de auth
                } catch (error) {
                    if (error.code === 'auth/user-not-found') {
                        this.setError('Usuario no encontrado. Regístrate primero.');
                    } else if (error.code === 'auth/wrong-password') {
                        this.setError('Contraseña incorrecta.');
                    } else {
                        this.setError('Error al iniciar sesión. Intenta nuevamente.');
                    }
                }

                this.setBusy(false);
            }

            async handleStudentRegister() {
                const { studentEmail, studentPass, studentName, studentId } = this.state;

                if (!studentName.trim() || !studentId.trim() || !studentEmail || !studentPass) {
                    return this.setError('Completa todos los campos.');
                }
                if (studentPass.length < 6) {
                    return this.setError('La contraseña debe tener al menos 6 caracteres.');
                }

                this.setBusy(true);
                this.setError('');
                this.setSuccess('');

                try {
                    const user = await FirebaseService.register(studentEmail, studentPass);
                    await FirebaseService.saveStudent({
                        id: user.uid,
                        name: studentName.trim(),
                        displayId: studentId.trim(),
                        email: studentEmail,
                        uid: user.uid,
                        role: 'student'
                    });
                    this.setSuccess('✅ ¡Registro exitoso! Ahora puedes iniciar sesión.');
                    setTimeout(() => {
                        this.setState({ view: 'student-login', studentEmail: '', studentPass: '' });
                    }, 1500);
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') {
                        this.setError('Este email ya está registrado. Inicia sesión.');
                    } else {
                        this.setError('Error al registrarse. Intenta nuevamente.');
                    }
                }

                this.setBusy(false);
            }

            async logout() {
                try {
                    await FirebaseService.logout();
                    this.state.isTeacher = false;
                    this.state.teacherData = null;
                    this.state.loggedStudent = null;
                    this.state.attemptsOfStudent = [];
                    this.state.authUser = null;
                    this.state.userRole = null;
                    if (this.state.examTimer) {
                        clearInterval(this.state.examTimer);
                        this.state.examTimer = null;
                    }
                    this.setState({ view: 'home', error: '', success: '' });
                } catch (error) {
                    console.error('Error al cerrar sesión:', error);
                }
            }

            // --- Teacher exam creation ---
            addDraftQuestion(type) {
                const newQ = { id: genId(), type: type, text: '' };
                if (type === 'tf') {
                    newQ.options = ['Verdadero', 'Falso'];
                    newQ.correctIndex = 0;
                } else if (type === 'sa') {
                    newQ.correctAnswer = '';
                    newQ.keywords = '';
                    newQ.correctIndex = null;
                } else {
                    newQ.options = ['', '', '', ''];
                    newQ.correctIndex = 0;
                }
                this.state.draftQuestions.push(newQ);
                this.render();
            }

            updateDraftQuestion(id, patch) {
                const q = this.state.draftQuestions.find(q => q.id === id);
                if (q) Object.assign(q, patch);
                this.render();
            }

            updateOption(id, i, value) {
                const q = this.state.draftQuestions.find(q => q.id === id);
                if (q && q.options) q.options[i] = value;
                this.render();
            }

            removeDraftQuestion(id) {
                this.state.draftQuestions = this.state.draftQuestions.filter(q => q.id !== id);
                this.render();
            }

            async saveDraftExam() {
                const { draftTitle, draftQuestions, draftTimeLimit, draftPart } = this.state;

                if (!draftTitle.trim()) return this.setError('Ponle un título al examen.');
                if (draftQuestions.length === 0) return this.setError('Agrega al menos una pregunta.');
                for (const q of draftQuestions) {
                    if (!q.text.trim()) return this.setError('Hay una pregunta sin enunciado.');
                    if (q.type !== 'sa' && q.options && q.options.some(o => !o.trim())) {
                        return this.setError('Hay una opción vacía.');
                    }
                    if (q.type === 'sa' && !q.correctAnswer?.trim()) {
                        return this.setError('La pregunta de respuesta corta debe tener una respuesta correcta definida.');
                    }
                }

                this.setBusy(true);
                this.setError('');
                this.setSuccess('');

                try {
                    await FirebaseService.saveExam({
                        title: draftTitle.trim(),
                        part: draftPart,
                        questions: draftQuestions,
                        timeLimit: draftTimeLimit,
                        createdBy: this.state.teacherData?.email || 'teacher',
                        createdByName: this.state.teacherData?.name || 'Profesor'
                    });
                    await this.loadExams();
                    this.state.draftTitle = '';
                    this.state.draftQuestions = [];
                    this.state.draftTimeLimit = 30;
                    this.setState({ view: 'teacher-dashboard', error: '', success: '✅ Examen guardado exitosamente.' });
                } catch (error) {
                    this.setError('Error al guardar el examen.');
                }

                this.setBusy(false);
            }

            // --- Exam taking ---
            async startExam(examId) {
                this.setBusy(true);
                try {
                    const exam = await FirebaseService.getExam(examId);
                    if (!exam) {
                        this.setError('El examen no existe.');
                        this.setBusy(false);
                        return;
                    }
                    this.state.activeExam = exam;
                    this.state.answers = {};
                    this.state.result = null;
                    this.state.timeRemaining = (exam.timeLimit || 30) * 60;
                    this.setState({ view: 'student-exam', error: '', success: '' });

                    if (this.state.examTimer) clearInterval(this.state.examTimer);
                    this.state.examTimer = setInterval(() => {
                        this.state.timeRemaining--;
                        if (this.state.timeRemaining <= 0) {
                            clearInterval(this.state.examTimer);
                            this.state.examTimer = null;
                            this.submitExam(true);
                        }
                        this.render();
                    }, 1000);
                } catch (error) {
                    this.setError('Error al cargar el examen.');
                }
                this.setBusy(false);
            }

            setAnswer(qId, value) {
                this.state.answers[qId] = value;
                this.render();
            }

            setShortAnswer(qId, value) {
                this.state.answers[qId] = value;
                this.render();
            }

            async submitExam(autoSubmit = false) {
                const { activeExam, answers, loggedStudent } = this.state;

                if (!autoSubmit && Object.keys(answers).length < activeExam.questions.length) {
                    return this.setError('Responde todas las preguntas antes de enviar.');
                }

                if (this.state.examTimer) {
                    clearInterval(this.state.examTimer);
                    this.state.examTimer = null;
                }

                this.setBusy(true);
                this.setError('');
                this.setSuccess('');

                let score = 0;
                const details = activeExam.questions.map(q => {
                    const chosen = answers[q.id];
                    let correct = false;

                    if (q.type === 'sa') {
                        // Validar respuesta corta comparando con la respuesta correcta
                        const correctAnswer = (q.correctAnswer || '').trim().toLowerCase();
                        const studentAnswer = (chosen || '').trim().toLowerCase();
                        // Limpiar espacios extra y comparar
                        const cleanCorrect = correctAnswer.replace(/\s+/g, ' ');
                        const cleanStudent = studentAnswer.replace(/\s+/g, ' ');
                        correct = cleanStudent === cleanCorrect;

                        // Si no coincide exactamente, verificar palabras clave
                        if (!correct && q.keywords) {
                            const keywords = q.keywords.split(',').map(k => k.trim().toLowerCase()).filter(Boolean);
                            correct = keywords.some(k => cleanStudent.includes(k));
                        }
                    } else {
                        correct = chosen === q.correctIndex;
                    }

                    if (correct) score++;
                    return {
                        questionId: q.id,
                        text: q.text,
                        type: q.type,
                        options: q.options || [],
                        correctIndex: q.correctIndex,
                        correctAnswer: q.correctAnswer || '',
                        keywords: q.keywords || '',
                        chosen: q.type === 'sa' ? null : chosen,
                        shortAnswer: q.type === 'sa' ? chosen || '' : null,
                        correct
                    };
                });

                const attempt = {
                    studentName: loggedStudent.name,
                    studentId: loggedStudent.id || loggedStudent.uid,
                    examId: activeExam.id,
                    examTitle: activeExam.title,
                    part: activeExam.part,
                    score,
                    total: activeExam.questions.length,
                    details,
                    autoSubmitted: autoSubmit,
                    gradingStatus: 'pending',
                    finalGrade: null,
                    teacherComments: []
                };

                try {
                    await FirebaseService.saveAttempt(attempt);
                    await this.loadStudentAttempts(loggedStudent.uid);
                    this.state.result = attempt;
                    this.setState({ view: 'student-result', error: '', success: '¡Examen enviado exitosamente!' });
                } catch (error) {
                    this.setError('Error al guardar el intento.');
                }

                this.setBusy(false);
            }

            cancelExam() {
                if (this.state.examTimer) {
                    clearInterval(this.state.examTimer);
                    this.state.examTimer = null;
                }
                this.setState({ view: 'student-list', error: '', success: '' });
            }

            // --- Teacher grading ---
            async goToGrade(attemptId) {
                this.setBusy(true);
                try {
                    const attempt = await FirebaseService.getAttempt(attemptId);
                    if (!attempt) {
                        this.setError('No se encontró el intento.');
                        this.setBusy(false);
                        return;
                    }

                    const questions = attempt.details.map((d, i) => ({
                        ...d,
                        index: i,
                        gradingCorrect: d.correct
                    }));

                    this.state.gradingAttempt = attempt;
                    this.state.gradingQuestions = questions;
                    this.setState({ view: 'teacher-grade', error: '', success: '' });
                } catch (error) {
                    this.setError('Error al cargar el intento.');
                }
                this.setBusy(false);
            }

            updateGradingQuestion(index, isCorrect) {
                const q = this.state.gradingQuestions[index];
                if (q) {
                    q.gradingCorrect = isCorrect;
                    this.render();
                }
            }

            async saveGrade() {
                const { gradingAttempt, gradingQuestions } = this.state;

                if (!gradingAttempt) return;

                const commentInput = document.getElementById('teacherCommentInput');
                const comment = commentInput ? commentInput.value.trim() : '';

                let finalScore = 0;
                const updatedDetails = gradingAttempt.details.map((d, i) => {
                    const q = gradingQuestions.find(g => g.index === i);
                    const isCorrect = q ? q.gradingCorrect : d.correct;
                    if (isCorrect) finalScore++;
                    return {
                        ...d,
                        correct: isCorrect
                    };
                });

                this.setBusy(true);
                this.setError('');
                this.setSuccess('');

                try {
                    await FirebaseService.updateAttempt(gradingAttempt.id, {
                        finalGrade: finalScore,
                        gradingStatus: 'graded',
                        details: updatedDetails
                    });

                    if (comment) {
                        await FirebaseService.addCommentToAttempt(
                            gradingAttempt.id,
                            comment,
                            this.state.teacherData?.name || 'Profesor'
                        );
                    }

                    this.setSuccess('✅ Calificación guardada exitosamente.');
                    setTimeout(() => {
                        this.goToTeacherResults();
                    }, 1000);
                } catch (error) {
                    this.setError('Error al guardar la calificación.');
                }

                this.setBusy(false);
            }

            // --- Results ---
            async openResults(examId) {
                this.setBusy(true);
                try {
                    const exam = await FirebaseService.getExam(examId);
                    const attempts = await FirebaseService.getAttemptsByExam(examId);

                    let stats = null;
                    if (attempts.length > 0) {
                        const scores = attempts.map(a => (a.score / a.total) * 100);
                        const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
                        const passRate = (scores.filter(s => s >= 60).length / scores.length) * 100;
                        stats = { avg, passRate, total: attempts.length };
                    }

                    this.state.resultsExam = exam;
                    this.state.resultsList = attempts;
                    this.state.stats = stats;
                    this.state.openAttempt = null;
                    this.setState({ view: 'teacher-results', error: '', success: '' });
                } catch (error) {
                    this.setError('Error al cargar resultados.');
                }
                this.setBusy(false);
            }

            async deleteExam(examId) {
                if (!confirm('¿Eliminar este examen y todos sus resultados?')) return;
                this.setBusy(true);
                try {
                    await FirebaseService.deleteExam(examId);
                    await this.loadExams();
                    this.setSuccess('✅ Examen eliminado.');
                    this.render();
                } catch (error) {
                    this.setError('Error al eliminar el examen.');
                }
                this.setBusy(false);
            }
        }

        // ============================================
        // INICIALIZAR
        // ============================================
        const app = new App();
        window.app = app;
    </script>
